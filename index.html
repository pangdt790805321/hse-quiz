制"],"a":0,"e":"手册规定：如果作业现场存在多个重大环境风险（如危险废物处理及处置、砂石废水、燃煤锅炉大气污染物排放物、液氨运输及使用、放射性仪器使用及保管等），每个重大环境风险要单独编制现场处置方案。","s":"第二部分 九、（一）6（1）"},{"id":"D09-003","t":"judge","c":"D09","q":"突发环境事件应急预案应与本单位综合预案相匹配，确保和上下级单位及地方政府的应急预案的联动性。","o":["正确","错误"],"a":0,"e":"手册规定：预案要与本单位的综合预案相匹配，确保和上下级单位及地方政府的应急预案的联动性。","s":"第二部分 九、（一）4（4）"},{"id":"D09-004","t":"single","c":"D09","q":"项目公司、总承包项目部在环境风险应急管理中的职责是：","o":["针对重大环境风险督促承包单位编制现场处置方案并备案管理，组织承包单位开展应急预案和现场处置方案的培训、演练","自行编制所有现场处置方案","仅负责监督检查","无需组织演练"],"a":0,"e":"手册规定：项目公司、总承包项目部针对重大环境风险督促承包单位编制现场处置方案，并备案管理，组织承包单位开展应急预案和现场处置方案的培训、演练。","s":"第二部分 九、（一）5"},{"id":"D10-001","t":"single","c":"D10","q":"下列哪类单位不需要建立能源消耗台账和污染物排放台账？","o":["一般类企业、子企业本部、二级生产经营单位、项目公司、总承包项目部","施工项目部","装备制造企业","投资运营项目部"],"a":0,"e":"手册规定：施工、投资运营、设计（工代）、监理项目部和装备制造企业根据主要能源消耗和污染物排放类型建立统计台账；一般类企业、子企业本部、二级生产经营单位、项目公司、总承包项目部不需要建立。","s":"第二部分 十、监测与统计（一）1"},{"id":"D10-002","t":"single","c":"D10","q":"能源消耗统计台账应包括的内容是：","o":["能源消耗类型、能源消耗量，并附购进和调出能源的财务凭据、能源结算单及其他凭证","仅能源消耗总量","仅能源采购发票","仅月度消耗曲线"],"a":0,"e":"手册规定：能源消耗统计台账包括能源消耗类型、能源消耗量，并附购进和调出能源的财务凭据、能源结算单及其他能源消费结算凭证，做到账物相符。","s":"第二部分 十、监测与统计（一）1（1）"},{"id":"D10-003","t":"single","c":"D10","q":"一、二、三类子企业本部及其二级生产经营单位应多久对下级单位的能源消耗与污染物排放数据进行统计汇总并逐级上报？","o":["每季度","每月","每半年","每年"],"a":0,"e":"手册规定：一、二、三类子企业本部及其二级生产经营单位每季度对下级单位的能源消耗与污染物排放数据进行统计汇总，编制统计监测报表和总结分析报告，并逐级上报。","s":"第二部分 十、监测与统计（一）4"},{"id":"D10-004","t":"single","c":"D10","q":"能源节约与生态环境保护总结分析报告应对同比增减幅度超过多少的主要指标分析原因？","o":["10%","5%","20%","30%"],"a":0,"e":"手册规定：总结分析报告包括对同比增减幅度超过10%的主要指标分析原因。","s":"第二部分 十、监测与统计（一）4（2）"},{"id":"D10-005","t":"judge","c":"D10","q":"污染物排放统计台账仅统计具备可计量的主要点源排放污染物，不涉及污染物排放的单位不建立污染排放统计台账。","o":["正确","错误"],"a":0,"e":"手册规定：污染物仅统计具备可计量的主要点源排放污染物，不涉及污染物排放的单位不建立污染排放统计台账。","s":"第二部分 十、监测与统计（一）1（2）"},{"id":"D11-001","t":"single","c":"D11","q":"项目可行性研究阶段，应按行业有关标准规范编制：","o":["节能环保专篇","安全专篇","水土保持方案","节能评估报告"],"a":0,"e":"手册规定：在项目可行性研究阶段，按行业有关标准规范编制节能环保专篇，初步设计、施工设计阶段根据防治环境污染和生态破坏工程措施编制环境保护设施投资概算。","s":"第二部分 十一、设代服务（一）1"},{"id":"D11-002","t":"judge","c":"D11","q":"设计交底应包括对有关环境保护（含水土保持）设施和措施内容进行交底。","o":["正确","错误"],"a":0,"e":"手册规定：设计交底应包括对有关环境保护（含水土保持）设施和措施内容进行交底；设计变更时按照国家、行业规范及时对配套的生态环境保护设施和措施进行合规变更。","s":"第二部分 十一、设代服务（一）4"},{"id":"D11-003","t":"single","c":"D11","q":"重大环保方案（涉及环评报告重要变化）的变更应：","o":["报原审批部门重新审批","由设计单位自行审批","由建设单位审批即可","无需审批"],"a":0,"e":"手册规定：查设计变更是否涉及环保水保方案的调整，查变更合规性，重大环保方案（涉及环评报告重要变化）的变更是否报原审批部门重新审批。","s":"第二部分 十一、设代服务（三）4"},{"id":"D12-001","t":"single","c":"D12","q":"监理规划及监理实施细则中应：","o":["包含对施工单位能源节约与生态环境保护工作的监理内容并执行","仅包含质量监理内容","由施工单位编制","无需包含环保内容"],"a":0,"e":"手册规定：监理规划及监理实施细则中包含对施工单位能源节约与生态环境保护工作的监理内容并执行。","s":"第二部分 十二、监理服务（一）1"},{"id":"D12-002","t":"single","c":"D12","q":"监理单位应审查施工单位的资料不包括：","o":["施工单位的施工组织设计","生态环境污染源清单","重大环境影响因素清单","专项生态环境保护方案"],"a":0,"e":"手册规定监理应审查：施工单位生态环境污染源清单和重大环境影响因素清单、专项生态环境保护方案、突发环境事件应急预案或现场处置方案。","s":"第二部分 十二、监理服务（一）2、3、4"},{"id":"D12-003","t":"judge","c":"D12","q":"监理单位应监督检查项目节能环保设施设备（如地热泵、空气热泵）的有效运行。","o":["正确","错误"],"a":0,"e":"手册规定：监督检查项目节能环保设施设备（如地热泵、空气热泵）的有效运行。","s":"第二部分 十二、监理服务（一）6"},{"id":"D13-001","t":"single","c":"D13","q":"统计监测报表及报告应通过什么系统报送？","o":["股份公司能源节约与生态环境保护综合管理系统","OA系统","电子邮件","纸质文件"],"a":0,"e":"手册规定：通过股份公司能源节约与生态环境保护综合管理系统按时报送统计监测报表及报告。","s":"第二部分 十三、信息报送（一）1"},{"id":"D13-002","t":"single","c":"D13","q":"事业部管理企业的报表报送时间为：","o":["报告期满之次月7日前","报告期满之次月12日前","报告期满之次月15日前","报告期满之次月20日前"],"a":0,"e":"手册规定：事业部管理企业报送时间为报告期满之次月7日前，其他子企业报送时间为报告期满之次月12日前。","s":"第二部分 十三、信息报送（一）1（4）"},{"id":"D13-003","t":"single","c":"D13","q":"其他子企业（非事业部管理企业）的报表报送时间为：","o":["报告期满之次月12日前","报告期满之次月7日前","报告期满之次月5日前","报告期满之次月15日前"],"a":0,"e":"手册规定：事业部管理企业报送时间为报告期满之次月7日前，其他子企业报送时间为报告期满之次月12日前。","s":"第二部分 十三、信息报送（一）1（4）"},{"id":"D13-004","t":"judge","c":"D13","q":"一般类企业不需要填报季度报表，年度报送能源节约与生态环境保护总结分析报告即可。","o":["正确","错误"],"a":0,"e":"手册规定：一般类企业不需要填报报表，年度报送能源节约与生态环境保护总结分析报告。","s":"第二部分 十三、信息报送（一）1（2）"},{"id":"D14-001","t":"single","c":"D14","q":"子企业本部每年开展检查时，对每个二级生产经营单位所属项目的年抽检不少于：","o":["3个","2个","5个","7个"],"a":0,"e":"手册规定：子企业本部每年开展的检查对直管项目和二级生产经营单位全覆盖，对每个二级生产经营单位所属项目的年抽检不少于3个；二级生产经营单位对所属项目部检查做到全覆盖。","s":"第二部分 十四、检查考核（一）1（2）"},{"id":"D14-002","t":"single","c":"D14","q":"施工项目部能源节约与生态环境保护综合检查的频次是：","o":["每月一次，由项目主要负责人带队，或与安全检查一并进行","每季度一次","每周一次","每年一次"],"a":0,"e":"手册规定：施工项目部每月组织开展一次能源节约与生态环境保护综合检查，或与安全检查一并进行，由项目主要负责人带队。","s":"第二部分 十四、检查考核（一）3（3）"},{"id":"D14-003","t":"judge","c":"D14","q":"设计（工代）、监理项目部不单独组织能源节约与生态环境保护检查考核工作，可与其他工作合并进行。","o":["正确","错误"],"a":0,"e":"手册规定：设计（工代）、监理项目部不单独组织能源节约与生态环境保护检查考核工作，可与其他工作合并进行。","s":"第二部分 十四、检查考核（一）5"},{"id":"D14-004","t":"single","c":"D14","q":"项目公司、总承包项目部对承包单位基础管理工作开展监督检查的频次是：","o":["月度监督检查","每季度一次","每周一次","每年一次"],"a":0,"e":"手册规定：项目公司、总承包项目部对承包单位的组织机构及人员、制度建设、计划制定、污染源识别评价、环境风险与应急等基础管理工作开展月度监督检查。","s":"第二部分 十四、检查考核（一）2（2）"},{"id":"D14-005","t":"judge","c":"D14","q":"能源节约与生态环境保护隐患排查工作可与安全隐患排查一并进行，考核工作可与检查一并进行，做到奖惩兑现。","o":["正确","错误"],"a":0,"e":"手册规定：能源节约与生态环境保护隐患排查工作可与安全隐患排查一并进行，隐患排查记录应齐全；考核工作可与检查一并进行，及时对考核结果进行汇总，做到奖惩兑现。","s":"第二部分 十四、检查考核（一）1（5）（6）"},{"id":"D15-001","t":"single","c":"D15","q":"能源节约与生态环境保护档案管理要求是：","o":["建立档案资料总目录、子目录，目录必须与档案资料相符","仅保存电子文件","由主管部门自行管理","无需目录"],"a":0,"e":"手册规定：建立档案资料总目录、子目录，目录必须与档案资料相符。","s":"第二部分 十五、档案管理（一）1"},{"id":"D15-002","t":"judge","c":"D15","q":"过期、作废的资料要及时进行处置并保留处置记录，新资料要动态更新及时建档。","o":["正确","错误"],"a":0,"e":"手册规定：过期、作废的资料要及时进行处置并保留处置记录，新资料要动态更新及时建档。","s":"第二部分 十五、档案管理（一）2"},{"id":"D16-001","t":"single","c":"D16","q":"风力达到几级以上时，应停止土方开挖、回填、转运等可能产生扬尘污染的施工作业？","o":["四级以上","三级以上","五级以上","六级以上"],"a":0,"e":"手册规定：风力四级以上，停止土方开挖、回填、转运以及其他可能产生扬尘污染的施工作业。","s":"第二部分 十六、现场管理（一）1（2）"},{"id":"D16-002","t":"single","c":"D16","q":"施工现场扬尘控制要求不包括：","o":["主要道路铺设沥青即可，无需洒水","裸露地面、堆放土方采取覆盖、固化、绿化等抑尘措施","易产生扬尘的机械设施配备降尘防尘装置","出入口处设置冲洗车辆的设施"],"a":0,"e":"手册规定：施工现场主要道路进行硬化处理，并进行洒水降尘；裸露地面、堆放土方采取覆盖、固化、绿化等抑尘措施；易产生扬尘机械设施配备降尘装置；出入口设置冲洗车辆设施。","s":"第二部分 十六、现场管理（一）1"},{"id":"D16-003","t":"single","c":"D16","q":"建筑垃圾土方砂石运输车辆应：","o":["采取措施防止运输遗撒，施工现场出入口处设置冲洗车辆的设施","覆盖后即可，无需冲洗","夜间运输即可","限速行驶即可"],"a":0,"e":"手册规定：建筑垃圾土方砂石运输车辆采取措施防止运输遗撒，施工现场出入口处设置冲洗车辆的设施。","s":"第二部分 十六、现场管理（一）1（7）"},{"id":"D16-004","t":"single","c":"D16",   var p = S.progress[q.c];

  html += '<div><b>' + doneAll + '</b><span>已刷</span></div><div><b>' + wrongIds().length + '</b><span>错题</span></div><div><b>' + (doneAll ? Math.round(correctAll / doneAll * 100) : 0) + '%</b><span>正确率</span></div></div></div>';
  DB.GROUPS.forEach(function (g) {
    var items = DB.CHAPTERS.filter(function (c) { return c.g === g.id });
    var tot = 0, dn = 0;
    items.forEach(function (c) { tot += (cm[c.id] || 0); var p = S.progress[c.id]; if (p) dn += Math.min(p.doneIds.length, cm[c.id] || 0) });
    var open = groupsOpen[g.id] !== false;
    html += '<div class="card"><div class="between" data-toggle="' + g.id + '"><div class="group">' + g.name + '</div><div><span class="sub">' + dn + '/' + tot + '</span><span class="arrow' + (open ? ' up' : '') + '">›</span></div></div>' +
      '<div class="bar"><i style="width:' + (tot ? Math.round(dn / tot * 100) : 0) + '%"></i></div>';
    if (open) {
      items.forEach(function (c) {
        var p = S.progress[c.id] || { doneIds: [] };
        var t = cm[c.id] || 0, d = Math.min(p.doneIds.length, t), pc = t ? Math.round(d / t * 100) : 0;
        html += '<div class="ch" data-chapter="' + c.id + '"><div class="between"><div class="ch-name">' + c.name + '</div><span class="tag ' + (pc === 100 ? 'g' : pc > 0 ? 'o' : '') + '">' + d + '/' + t + '</span></div><div class="bar"><i style="width:' + pc + '%"></i></div></div>';
      });
    }
    html += '</div>';
  });
  html += '<div class="tips">题库依据《2022年电建集团HSE检查考核工作指导手册》原文编制，每题附原文依据解析。</div>';
  return html;
}

function startQuiz(list, title, mode, cid) {
  quiz = { list: list, title: title, mode: mode, cid: cid, index: 0, correct: 0, wrong: 0, wrongIds: [], selected: -1, show: false, exam: false, start: Date.now() };
  view = 'quiz'; render();
}
function startExam(list, minutes) {
  quiz = { list: list, title: '模拟测试', mode: 'exam', index: 0, correct: 0, wrong: 0, wrongIds: [], selected: -1, show: false, exam: true, start: Date.now(), remain: minutes * 60 };
  if (quiz.timer) clearInterval(quiz.timer);
  quiz.timer = setInterval(function () {
    quiz.remain--;
    if (quiz.remain <= 0) { clearInterval(quiz.timer); finish() } else { render() }
  }, 1000);
  view = 'quiz'; render();
}
function viewQuiz() {
  var q = quiz.list[quiz.index], total = quiz.list.length;
  var h = '<div class="card"><div class="topbar"><div><b>' + (quiz.index + 1) + '</b> <span class="sub">/ ' + total + '</span></div>' +
    (quiz.exam ? '<div style="font-weight:600;color:' + (quiz.remain <= 60 ? '#c0392b' : '#1f2733') + '">' + fmt(quiz.remain) + '</div>' : '') +
    '<div><span style="color:#1a8a4a">✓ ' + quiz.correct + '</span> <span style="color:#c0392b;margin-left:10px">✗ ' + quiz.wrong + '</span></div></div>' +
    '<div class="bar"><i style="width:' + Math.round(quiz.index / total * 100) + '%"></i></div></div>';
  h += '<div class="card"><div class="between" style="margin-bottom:8px"><span class="tag">' + (q.t === 'judge' ? '判断题' : '单选题') + '</span><span class="sub">' + chapterName(q.c) + '</span></div>' +
    '<div class="q-title">' + q.q + '</div><div style="margin-top:12px">';
  q.o.forEach(function (o, i) {
    var cls = '';
    if (quiz.exam && quiz.selected === i) cls = 'right';
    else if (quiz.show) {
      if (i === q.a) cls = 'right';
      else if (i === quiz.selected) cls = 'wrong';
    }
    h += '<div class="opt ' + cls + '" data-opt="' + i + '"><div class="k">' + LETTERS[i] + '</div><div class="t">' + o + '</div></div>';
  });
  h += '</div>';
  if (quiz.show && !quiz.exam) {
    h += '<div class="ex"><div class="h ' + (quiz.selected === q.a ? 'r' : 'w') + '">' + (quiz.selected === q.a ? '回答正确' : '回答错误') + '</div>' +
      '<div class="b">正确答案：<b>' + LETTERS[q.a] + (q.t === 'judge' ? '' : '. ' + q.o[q.a]) + '</b><br>解析依据：' + q.e + '<div class="src">手册出处：' + q.s + '</div>' +
      '<div style="margin-top:8px"><span class="tag" data-fav="1">' + (S.fav.indexOf(q.id) >= 0 ? '★ 已收藏' : '☆ 收藏本题') + '</span></div></div></div>';
  }
  h += '</div>';
  h += '<div class="btn ' + (quiz.show || (quiz.exam && quiz.selected >= 0) ? '' : 'gray') + '" data-next="1">' +
    (quiz.index === total - 1 ? (quiz.exam ? '交卷' : '完成') : '下一题') + '</div>';
  if (quiz.index > 0) h += '<div class="btn ghost" style="margin-top:8px" data-prev="1">上一题</div>';
  return h;
}
function fmt(s) { var m = Math.floor(s / 60), ss = s % 60; return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss }
function answer(i) {
  if (quiz.show) return;
  if (quiz.exam && quiz.selected >= 0) return;
  var q = quiz.list[quiz.index], right = (i === q.a);
  quiz.selected = i; if (right) quiz.correct++; else { quiz.wrong++; quiz.wrongIds.push(q.id) }
  recordAnswer(q, right);
  if (quiz.exam) quiz.show = false; else quiz.show = true;
  if (!quiz.exam && S.setting.autoNext) { setTimeout(function () { next() }, 1200) }
  render();
}
function next() {
  if (quiz.exam && quiz.selected < 0) { alert('请先选择答案'); return }
  if (!quiz.exam && !quiz.show) { alert('请先选择答案'); return }
  if (quiz.index >= quiz.list.length - 1) { finish(); return }
  quiz.index++; quiz.selected = -1; quiz.show = false; render();
}
function prev() { if (quiz.index <= 0) return; quiz.index--; quiz.selected = -1; quiz.show = false; render() }
function finish() {
  if (quiz.timer) clearInterval(quiz.timer);
  var sec = Math.round((Date.now() - quiz.start) / 1000);
  lastSession = { title: quiz.title, mode: quiz.mode, cid: quiz.cid, total: quiz.list.length, correct: quiz.correct, wrong: quiz.wrong, seconds: sec, wrongIds: quiz.wrongIds, exam: quiz.exam };
  S.logs.push({ ts: Date.now(), title: quiz.title, total: quiz.list.length, correct: quiz.correct, seconds: sec });
  saveAll();
  view = 'result'; render();
}
function viewResult() {
  var s = lastSession, score = s.total ? Math.round(s.correct / s.total * 100) : 0;
  var h = '<div class="card" style="text-align:center"><div style="width:110px;height:110px;border-radius:50%;border:5px solid ' + (score >= 60 ? '#1a8a4a' : '#c0392b') + ';margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
    '<b style="font-size:38px;color:' + (score >= 60 ? '#1a8a4a' : '#c0392b') + '">' + score + '</b><span class="sub">分</span></div>' +
    '<div class="title" style="margin-top:14px">' + s.title + '</div><div class="sub">' + (score >= 90 ? '掌握扎实，继续巩固' : score >= 60 ? '基本掌握，建议复习错题' : '尚未达标，建议重刷本章') + '</div>' +
    '<div class="stats"><div><b>' + s.total + '</b><span>题目数</span></div><div><b style="color:#1a8a4a">' + s.correct + '</b><span>答对</span></div><div><b style="color:#c0392b">' + s.wrong + '</b><span>答错</span></div><div><b>' + Math.floor(s.seconds / 60) + '分' + (s.seconds % 60) + '秒</b><span>用时</span></div></div></div>';
  if (s.wrongIds.length) {
    h += '<div class="card"><div class="title" style="font-size:15px">错题回顾（' + s.wrongIds.length + '）</div>';
    s.wrongIds.forEach(function (id, i) {
      var q = null; DB.QUESTIONS.forEach(function (x) { if (x.id === id) q = x }); if (!q) return;
      h += '<div class="wq">' + (i + 1) + '. ' + q.q + '<div class="a">正确答案：' + LETTERS[q.a] + (q.t === 'judge' ? '' : '. ' + q.o[q.a]) + '</div></div>';
    });
    h += '</div>';
  }
  h += '<div class="btn" data-again="1">再来一轮</div><div class="btn gray" style="margin-top:8px" data-home="1">返回章节</div>';
  return h;
}
function viewExam() {
  var counts = [20, 30, 50, 80, 100, 200], mins = [10, 15, 20, 30, 45, 60];
  var h = '<div class="card"><div class="title">模拟测试</div><div class="sub">从全部题库随机抽题，限时作答，交卷后出成绩单</div></div>';
  h += '<div class="card"><div class="title" style="font-size:15px">题目数量</div><div class="optgrid" style="margin-top:10px">';
  counts.forEach(function (c) { h += '<div class="' + (S.setting.examCount === c ? 'on' : '') + '" data-count="' + c + '">' + c + ' 题</div>' });
  h += '</div></div>';
  h += '<div class="card"><div class="title" style="font-size:15px">考试时长</div><div class="optgrid" style="margin-top:10px">';
  mins.forEach(function (m) { h += '<div class="' + (S.setting.examMinutes === m ? 'on' : '') + '" data-min="' + m + '">' + m + ' 分钟</div>' });
  h += '</div></div>';
  h += '<div class="card"><div class="between"><span class="sub">总题量</span><span>' + DB.QUESTIONS.length + ' 题</span></div><div class="between" style="margin-top:6px"><span class="sub">章节数</span><span>' + DB.CHAPTERS.length + ' 章</span></div></div>';
  h += '<div class="btn" data-startexam="1">开始测试</div><div class="hint">测试过程中不显示对错，交卷后统一查看成绩与解析</div>';
  return h;
}
function viewWrong() {
  var ids = wrongIds();
  var h = '<div class="card"><div class="between"><div><div class="title" style="font-size:15px">错题本</div><div class="sub">连续答对 2 次后自动移出</div></div><span class="tag r">' + ids.length + ' 题</span></div>';
  if (ids.length) h += '<div class="btn" style="margin-top:10px" data-redowrong="1">全部重刷</div>';
  h += '</div>';
  if (!ids.length) h += '<div class="empty">暂无错题，继续保持</div>';
  ids.forEach(function (id) {
    var q = null; DB.QUESTIONS.forEach(function (x) { if (x.id === id) q = x }); if (!q) return;
    h += '<div class="card"><div class="between"><span class="tag">' + chapterName(q.c) + '</span><span class="tag r">错 ' + S.wrong[id].wrongCount + ' 次</span></div>' +
      '<div class="wq">' + q.q + '<div class="a">正确答案：' + LETTERS[q.a] + (q.t === 'judge' ? '' : '. ' + q.o[q.a]) + '</div><div class="e">' + q.e + '</div></div></div>';
  });
  return h;
}
function viewStats() {
  var cm = countMap(), done = 0, correct = 0;
  DB.CHAPTERS.forEach(function (c) {
    var p = S.progress[c.id]; if (!p) return;
    done += Math.min(p.doneIds.length, cm[c.id] || 0); correct += Math.min(p.correctIds.length, cm[c.id] || 0);
  });
  var h = '<div class="card"><div class="title" style="font-size:15px">总体进度</div><div class="between" style="margin-top:8px"><span class="sub">已刷 ' + done + ' / ' + DB.QUESTIONS.length + ' 题</span><span style="color:#1a5fb4">' + Math.round(done / DB.QUESTIONS.length * 100) + '%</span></div>' +
    '<div class="bar"><i style="width:' + Math.round(done / DB.QUESTIONS.length * 100) + '%"></i></div>' +
    '<div class="stats"><div><b>' + (done ? Math.round(correct / done * 100) : 0) + '%</b><span>总正确率</span></div><div><b style="color:#c0392b">' + wrongIds().length + '</b><span>错题</span></div><div><b>' + S.fav.length + '</b><span>收藏</span></div><div><b>' + S.logs.length + '</b><span>练习次数</span></div></div></div>';
  h += '<div class="card"><div class="title" style="font-size:15px">各章节掌握情况</div>';
  DB.CHAPTERS.forEach(function (c) {
    var p = S.progress[c.id] || { doneIds: [] }, t = cm[c.id] || 0, d = Math.min(p.doneIds.length, t);
    h += '<div style="padding:8px 0;border-bottom:1px solid #f5f7fa"><div class="between"><span style="font-size:13px;flex:1">' + c.name + '</span><span class="sub">' + d + '/' + t + '</span></div><div class="bar"><i style="width:' + (t ? Math.round(d / t * 100) : 0) + '%"></i></div></div>';
  });
  h += '</div>';
  h += '<div class="btn gray" data-clear="1">清空全部学习数据</div><div class="tips">学习数据保存在本机浏览器中，不上传服务器；清理浏览器数据会清空进度。</div>';
  return h;
}

function bind() {
  var el = document.getElementById('screen');
  el.querySelectorAll('[data-toggle]').forEach(function (n) {
    n.onclick = function () { groupsOpen[n.dataset.toggle] = groupsOpen[n.dataset.toggle] === false; render() };
  });
  el.querySelectorAll('[data-chapter]').forEach(function (n) {
    n.onclick = function () {
      var cid = n.dataset.chapter;
      var list = DB.QUESTIONS.filter(function (q) { return q.c === cid });
      startQuiz(list, chapterName(cid), 'chapter', cid);
    };
  });
  el.querySelectorAll('[data-opt]').forEach(function (n) { n.onclick = function () { answer(parseInt(n.dataset.opt, 10)) } });
  var nx = el.querySelector('[data-next]'); if (nx) nx.onclick = next;
  var pv = el.querySelector('[data-prev]'); if (pv) pv.onclick = prev;
  var fv = el.querySelector('[data-fav]'); if (fv) fv.onclick = function () {
    var q = quiz.list[quiz.index], i = S.fav.indexOf(q.id);
    if (i >= 0) S.fav.splice(i, 1); else S.fav.push(q.id);
    saveAll(); render();
  };
  var ag = el.querySelector('[data-again]'); if (ag) ag.onclick = function () {
    if (lastSession.exam) { view = 'exam' } else if (lastSession.cid) { startQuiz(DB.QUESTIONS.filter(function (q) { return q.c === lastSession.cid }), chapterName(lastSession.cid), 'chapter', lastSession.cid) } else { view = 'index' }
    render();
  };
  var hm = el.querySelector('[data-home]'); if (hm) hm.onclick = function () { view = 'index'; render() };
  el.querySelectorAll('[data-count]').forEach(function (n) { n.onclick = function () { S.setting.examCount = parseInt(n.dataset.count, 10); saveAll(); render() } });
  el.querySelectorAll('[data-min]').forEach(function (n) { n.onclick = function () { S.setting.examMinutes = parseInt(n.dataset.min, 10); saveAll(); render() } });
  var se = el.querySelector('[data-startexam]'); if (se) se.onclick = function () {
    var n = Math.min(S.setting.examCount, DB.QUESTIONS.length);
    startExam(shuffle(DB.QUESTIONS).slice(0, n), S.setting.examMinutes);
  };
  var rw = el.querySelector('[data-redowrong]'); if (rw) rw.onclick = function () {
    var ids = wrongIds();
    startQuiz(DB.QUESTIONS.filter(function (q) { return ids.indexOf(q.id) >= 0 }), '错题重刷', 'wrong');
  };
  var cl = el.querySelector('[data-clear]'); if (cl) cl.onclick = function () {
    if (confirm('将清空进度、错题、收藏和练习记录，且无法恢复。确定继续？')) { S.progress = {}; S.wrong = {}; S.fav = []; S.logs = []; saveAll(); render() }
  };
}
document.getElementById('tabbar').addEventListener('click', function (e) {
  var t = e.target.dataset && e.target.dataset.tab; if (!t) return;
  if (quiz && quiz.timer) clearInterval(quiz.timer);
  quiz = null; view = t; render();
});
render();
</script>
</body>
</html>
