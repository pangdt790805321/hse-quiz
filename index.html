ame":"附件与检查考核表"},{"id":"D01","g":"D","name":"1. 贯彻落实上级要求"},{"id":"D02","g":"D","name":"2. 组织机构、人员及职责"},{"id":"D03","g":"D","name":"3. 管理制度"},{"id":"D04","g":"D","name":"4. 工作计划"},{"id":"D05","g":"D","name":"5. 宣传培训"},{"id":"D06","g":"D","name":"6. 费用投入及使用管理"},{"id":"D07","g":"D","name":"7. 耗能设备设施和污染源识别评价"},{"id":"D08","g":"D","name":"8. 能源节约与生态环境保护专项措施"},{"id":"D09","g":"D","name":"9. 环境风险与应急管理"},{"id":"D10","g":"D","name":"10. 监测与统计"},{"id":"D11","g":"D","name":"11. 设代服务"},{"id":"D12","g":"D","name":"12. 监理服务"},{"id":"D13","g":"D","name":"13. 信息报送"},{"id":"D14","g":"D","name":"14. 检查考核"},{"id":"D15","g":"D","name":"15. 档案管理"},{"id":"D16","g":"D","name":"16. 现场管理"},{"id":"D17","g":"D","name":"17. 附件"}],"QUESTIONS":[{"id":"A01-001","t":"single","c":"A01","q":"手册规定，贯彻落实上级要求时严禁出现的做法是：","o":["以会议传达会议、以文件传达文件","召开专题会议进行部署","领导批示后由主管部门制定落实措施","保留发放文件的具体要求记录"],"a":0,"e":"手册明确：严禁以会议传达会议、以文件传达文件，领导不能简单一“阅”了之或“请某某阅处”处理，应有具体的落实意见，检查时必须查询相关验证记录。","s":"第一部分（一）1.贯彻上级要求 1.1安全文件"},{"id":"A01-002","t":"judge","c":"A01","q":"对股份公司的文件，子企业的二级单位、项目部应经其隶属上级单位批转，并提出落实要求。","o":["正确","错误"],"a":0,"e":"手册要求：对股份公司的文件，子企业的二级单位、项目部应经其隶属上级单位批转，提出落实要求。若个别股份公司文件通过工作群直接发到项目部，应保留发放该文件的机关的具体要求。","s":"第一部分（一）1.贯彻上级要求 1.1安全文件"},{"id":"A01-003","t":"single","c":"A01","q":"企业总部主要负责人对上级印发的重要文件进行批示时，应依据什么提出工作要求？","o":["法定七项职责","上级单位口头要求","本单位年度产值规模","安全检查考核表"],"a":0,"e":"手册要求：企业总部主要负责人应依据法定七项职责对上级印发的重要文件（涉及全年性工作、重要专项工作和需要主要负责人亲自部署的工作等）进行批示并提出总体或具体的工作要求。","s":"第一部分（一）1.贯彻上级要求 1.1安全文件（1）企业总部①"},{"id":"A01-004","t":"single","c":"A01","q":"安全总监及业务主管部门在文件落实中的职责是：","o":["针对领导的批示制定具体的落实措施","只需将文件转发至项目部即可","等待上级再次发文后再行动","仅由安全总监个人学习领会"],"a":0,"e":"手册要求：安全总监及业务主管部门应针对领导的批示制定具体的落实措施，按照主要领导和分管领导的批示，提出具体落实意见和承办人，做到查批示、查方案、查实施记录。","s":"第一部分（一）1.贯彻上级要求 1.1安全文件（1）企业总部③"},{"id":"A01-005","t":"single","c":"A01","q":"双重预防机制建设中，子企业应按规定多久发布一次一级安全风险管控清单？","o":["每季度","每月","每半年","每年"],"a":0,"e":"手册规定：子企业每季度按规定发布一级安全风险管控清单，所属二级单位发布一级、二级安全风险管控清单，项目部每月对二级及以上安全风险管控清单进行更新。","s":"第一部分（一）1.贯彻上级要求 重点工作落实6.双重预防机制建设"},{"id":"A01-006","t":"single","c":"A01","q":"项目部应对二级及以上安全风险管控清单多久更新一次？","o":["每月","每季度","每半年","每年"],"a":0,"e":"手册规定：项目部每月对二级及以上安全风险管控清单进行更新。","s":"第一部分（一）1.贯彻上级要求 重点工作落实6.双重预防机制建设"},{"id":"A01-007","t":"single","c":"A01","q":"科技兴安工作中，建筑施工类子企业每年开展安全技术攻关不少于几项？","o":["2项","1项","3项","5项"],"a":0,"e":"手册要求：围绕高风险施工工序等分级分类开展攻关，建筑施工类子企业不少于2项，其他子企业不少于1项，4月底向公司备案。","s":"第一部分（一）1.贯彻上级要求 重点工作落实7.科技兴安"},{"id":"A01-008","t":"judge","c":"A01","q":"项目“四个责任体系”负责人、项目班子和管理人员对施工班组实行“包保”，每周至少一次深入班组一线讲安全、教方法、解难题。","o":["正确","错误"],"a":0,"e":"手册规定：项目“四个责任体系”负责人、项目班子和管理人员对施工班组实行“包保”，深度参与班组“安全日”、班前“五分钟”等安全活动，每周至少一次深入班组一线讲安全、教方法、解难题。","s":"第一部分（一）1.贯彻上级要求 重点工作落实9.班组安全建设"},{"id":"A01-009","t":"single","c":"A01","q":"春节安全文件落实示例中，企业党政主要领导对项目实行：","o":["抽检制","包片制","值班制","巡查制"],"a":0,"e":"手册示例：要求党政主要领导对项目实行“抽检制”，其他领导实行“包片制”，春节期间对每个项目至少打两次电话抽查值班情况。","s":"第一部分（一）1.贯彻上级要求 春节安全文件落实示例"},{"id":"A01-010","t":"judge","c":"A01","q":"对高危作业环节，应全面实施作业票和施工许可管理“双控”，由生产经理、总工确认安全条件满足后方能施工。","o":["正确","错误"],"a":0,"e":"手册要求：对高危作业环节，全面实施作业票和施工许可管理“双控”，由生产经理、总工确认安全条件满足后，方能施工。","s":"第一部分（一）1.贯彻上级要求 重点工作落实10.危大工程和高危作业"},{"id":"A01-011","t":"single","c":"A01","q":"事故管理方面，手册要求复盘上年度事故后应：","o":["从各个管理层级、环节分析根源性问题并制定管控防范措施","只对直接责任人进行处理","将事故资料归档即可","向上级书面检讨"],"a":0,"e":"手册要求：复盘上年度事故，从各个管理层级、各个管理环节认真分析引发事故的根源性问题，制定针对性管控防范措施。","s":"第一部分（一）1.贯彻上级要求 重点工作落实3.事故管理"},{"id":"A01-012","t":"single","c":"A01","q":"履职清单建设的总体要求是：","o":["一岗一清单、一岗一考核","一人一清单、一年一考核","一部门一清单、一季一考核","一项目一清单、一月一考核"],"a":0,"e":"手册要求：按照“一岗一清单、一岗一考核”要求，深化履职清单建设，以“清单化”管理拧紧责任链条，确保年度重点任务落实到位。","s":"第一部分（一）1.贯彻上级要求 重点工作落实5.履职清单建设"},{"id":"A03-001","t":"single","c":"A03","q":"安全生产委员会成立及调整的文件，应由谁签发？","o":["第一责任人","安全总监","分管安全领导","安委会办公室主任"],"a":0,"e":"手册要求：应成立安委会并根据人员变化及时调整，成立及调整安委会的文件应由第一责任人签发。","s":"第一部分（一）3.组织机构与人员 3.1（1）安全生产委员会①"},{"id":"A03-002","t":"single","c":"A03","q":"企业总部安委会组成人员原则上要覆盖领导层，但手册明确哪类人员除外？","o":["纪委书记","工会主席","总工程师","总会计师"],"a":0,"e":"手册规定：企业总部安委会组成人员原则上要覆盖领导层（纪委书记除外）、安全总监、职能部门主要负责人。","s":"第一部分（一）3.组织机构与人员 3.1（1）安全生产委员会②"},{"id":"A03-003","t":"judge","c":"A03","q":"总承包项目安全生产委员会应把由总包方直接发包的参建方负责人全部纳入。","o":["正确","错误"],"a":0,"e":"手册规定：总承包项目安全生产委员会应把由总包方直接发包的参建方负责人全部纳入（组成人员及隶属关系）。","s":"第一部分（一）3.组织机构与人员 3.1（1）安全生产委员会④"},{"id":"A03-004","t":"single","c":"A03","q":"手册要求安全环保部门职责界定中，明确杜绝将下列哪些职责纳入安全环保部门？","o":["保卫、信息、科技、生产等职责","安全教育培训职责","职业健康监护职责","应急管理职责"],"a":0,"e":"手册要求：凡明确安全环保职能部门的企业，都应将安全生产、职业健康与其他管理在职责、人员配备上明确界定，杜绝将保卫、信息、科技、生产等职责纳入安全环保部门。","s":"第一部分（一）3.组织机构与人员 3.1（2）安全部门设置②"},{"id":"A03-005","t":"single","c":"A03","q":"法人单位的安全总监持证要求是：","o":["取“三类人员”A证","取“三类人员”C证","取注册安全工程师证","无需持证"],"a":0,"e":"手册规定：安全总监应持证上岗，法人单位的安全总监可取“三类人员”A证，非法人单位的应取C证，地方政府另有要求的从其规定。","s":"第一部分（一）3.组织机构与人员 3.2（1）安全总监③"},{"id":"A03-006","t":"judge","c":"A03","q":"企业安全总监是企业高管，二级生产经营单位、项目安全总监是其班子成员。","o":["正确","错误"],"a":0,"e":"手册规定：应按规定配备安全总监，企业安全总监是企业高管，二级生产经营单位、项目安全总监是其班子成员。","s":"第一部分（一）3.组织机构与人员 3.2（1）安全总监①"},{"id":"A03-007","t":"single","c":"A03","q":"劳务分包单位施工人员在50人以下的，应当配备几名专职安全生产管理人员？","o":["1名","2名","3名","可不配备"],"a":0,"e":"手册规定：劳务分包单位施工人员在50人以下的，应当配备1名专职安全生产管理人员；50人-200人的配备2名；200人及以上的配备3名及以上。","s":"第一部分（一）3.组织机构与人员 3.2（2）专职安全人员配备"},{"id":"A03-008","t":"single","c":"A03","q":"劳务分包单位施工人员在200人及以上的，应当配备专职安全生产管理人员：","o":["3名及以上","1名","2名","5名及以上"],"a":0,"e":"手册规定：200人及以上的，应当配备3名及以上专职安全生产管理人员，并根据所承担的分部分项工程施工危险实际情况增加。专职安全员必须持证上岗。","s":"第一部分（一）3.组织机构与人员 3.2（2）专职安全人员配备"},{"id":"A03-009","t":"judge","c":"A03","q":"刚毕业、转岗人员从事安全管理工作因取证条件限制可放宽至规定期限，但可以独立行使监督检查权限。","o":["正确","错误"],"a":1,"e":"手册规定：刚毕业、转岗人员从事安全管理工作因取证条件限制可放宽至规定期限，但应经过相关培训上岗，并且不能独立行使监督检查权限。","s":"第一部分（一）3.组织机构与人员 3.2（2）专职安全人员配备③"},{"id":"A03-010","t":"single","c":"A03","q":"施工项目部年产值小于3亿元的，专职安全管理人员配备不少于：","o":["3人","4人","2人","1人"],"a":0,"e":"股份公司安全生产分类监管表规定：施工项目部四个责任体系责任人不交叉（配置4人），年产值≥3亿的不少于4人，年产值<3亿的不少于3人。","s":"第一部分（一）3.组织机构与人员 股份公司安全生产分类监管表"},{"id":"A03-011","t":"single","c":"A03","q":"总承包部（项目公司）四个责任体系责任人配置要求是：","o":["不允许交叉，配置4人","可以交叉，至少3人","不允许交叉，配置3人","可以交叉，至少2人"],"a":0,"e":"分类监管表规定：总承包部（项目公司）四个责任体系责任人不允许交叉（配置4人），总部及二级单位可以交叉但行政管理体系不能与监督体系交叉。","s":"第一部分（一）3.组织机构与人员 股份公司安全生产分类监管表"},{"id":"A03-012","t":"single","c":"A03","q":"专职安全管理人员配置中，能源节约与生态环境保护人员如何配备？","o":["在安全管理人员配置的基数上增设1人","不再单独配备，由安全管理人员兼任","按项目人数比例配备","由分包单位负责配备"],"a":0,"e":"分类监管表备注：专职安全管理人员配置未包括能源节约与生态环境保护人员，此业务人员应在安全管理人员配置的基数上增设1人。","s":"第一部分（一）3.组织机构与人员 分类监管表备注"},{"id":"A03-013","t":"judge","c":"A03","q":"项目部安全与职业健康管理人员配备人数，包括项目部兼职安全人员。","o":["正确","错误"],"a":1,"e":"手册特别强调：项目部安全与职业健康管理人员配备，主要指项目部安全管理部门人员配备，不包括兼职安全人员。","s":"第一部分（一）3.组织机构与人员 特别强调（1）"},{"id":"A03-014","t":"single","c":"A03","q":"从事总承包业务的非一类企业，年营业收入超过多少时纳入一类企业管理？","o":["20亿元","10亿元","30亿元","50亿元"],"a":0,"e":"分类监管表备注：从事总承包业务的非一类企业，年营业收入超过20亿元时纳入一类企业管理。","s":"第一部分（一）3.组织机构与人员 分类监管表备注"},{"id":"A03-015","t":"single","c":"A03","q":"在“其他部门”安全职责检查中，负责将安全生产规划纳入企业发展规划的部门是：","o":["战略发展部","总经理工作部","党委工作部","工会"],"a":0,"e":"手册规定：战略发展部负责安全生产规划纳入企业发展规划，研究国家有关安全生产工作的新政策并提出对安全生产工作的建议。","s":"第一部分（一）3.组织机构与人员 2.6其他部门（4）"},{"id":"A03-016","t":"single","c":"A03","q":"下列哪一项属于总经理工作部的安全职责？","o":["安全文件的处置，安全会议记录、纪要的管理","监督员工工伤保险和伤亡事故处理","宣传安全生产、指导群众性安全活动","安全生产规划纳入企业发展规划"],"a":0,"e":"手册规定：总经理工作部负责安全文件的处置、安全会议记录和纪要的管理；工会负责监督工伤保险和伤亡事故处理；党委工作部负责宣传和群众性活动；战略发展部负责规划。","s":"第一部分（一）3.组织机构与人员 2.6其他部门（1）"},{"id":"A03-017","t":"single","c":"A03","q":"验证安全管理人员配备真实性时，手册要求必要时应查证：","o":["工资单、参加会议或检查等履职记录","个人学历证书","安全培训合格证","劳动合同"],"a":0,"e":"手册特别强调：验证人员配备的真实性，必要时要查证工资单、参加会议/检查等履职记录。","s":"第一部分（一）3.组织机构与人员 特别强调（3）"},{"id":"A04-001","t":"judge","c":"A04","q":"企业年度安全生产工作计划应经安委会或相关会议讨论通过，并经第一责任人签发。","o":["正确","错误"],"a":0,"e":"手册规定：应制定企业安全生产工作计划，经安委会或相关会议讨论通过，并经第一责任人签发。","s":"第一部分（一）4.工作计划 4.1年度工作计划（1）"},{"id":"A04-002","t":"single","c":"A04","q":"年度工作计划配套的实施进度安排表，应明确的内容不包括：","o":["员工个人绩效工资标准","工作任务","责任部门及责任人","完成时限"],"a":0,"e":"手册规定：要有配套的计划实施进度安排表，明确工作任务、责任部门、责任人、完成时限。","s":"第一部分（一）4.工作计划 4.1年度工作计划（2）"},{"id":"A04-003","t":"judge","c":"A04","q":"项目部月度安全生产与职业健康工作计划应经安全总监审批后下发。","o":["正确","错误"],"a":0,"e":"手册规定：项目部月度安全生产与职业健康工作计划应经安全总监审批后下发。","s":"第一部分（一）4.工作计划 4.2月度工作计划（4）"},{"id":"A04-004","t":"single","c":"A04","q":"国家、部委及上级单位部署安排的临时工作或当月开展的专项行动，应在哪里安排？","o":["月度工作计划","年度工作计划","下年度工作计划","安全生产费用计划"],"a":0,"e":"手册规定：国家、部委及上级单位部署安排的临时工作或当月开展的专项行动应在月度计划中进行安排。","s":"第一部分（一）4.工作计划 4.2月度工作计划（2）"},{"id":"A04-005","t":"single","c":"A04","q":"企业总部安全部门对月度计划进行安排时，应报谁同意？","o":["分管领导及安全总监","第一责任人","安委会全体成员","上级单位安全部门"],"a":0,"e":"手册规定：企业总部安全部门应对月度计划进行安排，应报分管领导及安全总监同意，涉及到相关职能部门的应发送到相关部门。","s":"第一部分（一）4.工作计划 4.2月度工作计划（3）"},{"id":"A04-006","t":"single","c":"A04","q":"工作计划执行情况的抽检率应不低于：","o":["20%","10%","30%","50%"],"a":0,"e":"手册规定：工作计划执行情况的抽检率应以不低于20%数量进行。","s":"第一部分（一）4.工作计划 注"},{"id":"A04-007","t":"judge","c":"A04","q":"未按月度工作计划完成的工作，可以不作说明，顺延到下月即可。","o":["正确","错误"],"a":1,"e":"手册规定：未按月度工作计划完成的工作，须进行原因说明（年度计划同样要求未按计划完成的工作须进行原因说明）。","s":"第一部分（一）4.工作计划 4.2月度工作计划（5）"},{"id":"A04-008","t":"single","c":"A04","q":"关于年度工作计划与月度工作计划的区别，下列说法正确的是：","o":["年度计划内容相对宏观，是对全年安全生产工作的指导","月度计划内容比年度计划更宏观","两者内容基本相同，只是时间跨度不同","年度计划不需要进度安排表"],"a":0,"e":"手册说明：年度工作计划是对全年安全生产指导思想、目标任务、重点工作及常态化工作的安排和部署，内容相对较为宏观，主要是对全年安全生产工作的指导；月度计划依据年计划按月制定工作进度安排表。","s":"第一部分（一）4.工作计划 补充知识（2）"},{"id":"A02-001","t":"single","c":"A02","q":"安全生产责任体系的基本要求是：按什么原则建立并完善安全生产责任制、明确“四个责任体系”各级责任人？","o":["党政同责、一岗双责、失职追责","谁主管、谁负责","安全第一、预防为主","管生产必须管安全"],"a":0,"e":"手册规定：按“党政同责、一岗双责、失职追责”原则，建立并完善安全生产责任制、明确“四个责任体系”各级责任人。","s":"第一部分（一）2.安全生产责任体系 基本要求"},{"id":"A02-002","t":"single","c":"A02","q":"四个责任体系是指安全行政管理体系、安全技术支撑体系和：","o":["安全生产实施体系、安全监督管理体系","安全生产保障体系、安全考核体系","安全教育培训体系、安全投入体系","安全风险管控体系、隐患排查体系"],"a":0,"e":"手册中四个责任体系为：安全行政管理体系（2.1）、安全技术支撑体系（2.2）、安全生产实施体系（2.3）、安全监督管理体系（2.4）。","s":"第一部分（一）2.安全生产责任体系"},{"id":"A02-003","t":"single","c":"A02","q":"一、二类企业总部的四个责任体系责任人配置要求是：","o":["可以交叉（至少3人），但安全行政管理体系不能与安全监督管理体系交叉","可以交叉（至少2人），无其他限制","不允许交叉，必须配置4人","可以交叉（至少4人），无任何限制"],"a":0,"e":"手册规定：一、二类企业总部的四个责任体系责任人可以交叉（至少3人，但安全行政管理体系不能与安全监督管理体系交叉）；三类企业总部可以交叉（至少2人），同样要求行政体系不能与监督体系交叉。","s":"第一部分（一）2.安全生产责任体系 责任人配置（1）（2）"},{"id":"A02-004","t":"single","c":"A02","q":"下列哪类人员不属于安全行政管理体系主要负责人？","o":["安全总监","董事长（执行董事）","项目经理","班组长"],"a":0,"e":"安全行政管理体系主要负责人指各级董事长（执行董事）、总经理、职能部门主任、事业部主任、二级生产经营单位第一责任人、项目经理、工区（厂、队、车间）主任（长）、班组长等；安全总监属于安全监督管理体系。","s":"第一部分（一）2.1安全行政管理体系"},{"id":"A02-005","t":"single","c":"A02","q":"董事长（主要负责人）安全职责及履职清单共有：","o":["7项职责31项履职清单","8项职责18项履职清单","9项职责25项履职清单","10项职责22项履职清单"],"a":0,"e":"手册明确：董事长安全职责及履职清单为7项职责31项履职清单；总经理为8项职责18项；分管安全生产副总经理为9项职责25项；安全总监为10项职责22项。","s":"第一部分（一）2.1.1董事长安全职责及履职清单"},{"id":"A02-006","t":"single","c":"A02","q":"董事长应多久至少组织开展一次对安全生产责任制的考核并兑现奖惩？","o":["每年至少一次","每半年一次","每季度一次","每月一次"],"a":0,"e":"手册规定：董事长每年至少组织开展一次对安全生产责任制的考核，并兑现奖惩。","s":"第一部分（一）2.1.1 1）（3）"},{"id":"A02-007","t":"single","c":"A02","q":"安全生产规章制度编修的7大程序中，需要一把手亲自批准的是：","o":["程序4 批准","程序1 起草","程序3 审议","程序6 培训"],"a":0,"e":"手册规定7大程序为起草、会签、审议、批准、发布、培训、修订；其中程序1、7需要一把手组织实施，程序3需要一把手主持审议，程序4需要一把手亲自批准，程序2、5、6需要一把手督促实施。","s":"第一部分（一）2.1.1 2）7大程序"},{"id":"A02-008","t":"single","c":"A02","q":"安全生产规章制度的评审和全面修订周期分别是：","o":["一年评审一次，3~5年全面修订","半年评审一次，2年全面修订","两年评审一次，5年全面修订","一年评审一次，每年全面修订"],"a":0,"e":"手册规定：安全生产规章制度一年评审一次，3~5年全面修订；安委会审议后，涉及“三重一大”的制度应提交党委会议审议。","s":"第一部分（一）2.1.1 2）7大程序"},{"id":"A02-009","t":"single","c":"A02","q":"事故发生后，单位负责人接到现场人员报告后，应当于多长时间内向有关部门上报事故情况？","o":["1小时内","2小时内","30分钟内","24小时内"],"a":0,"e":"手册引用《生产安全事故报告和调查处理条例》（国务院493号令）：现场人员立即向本单位负责人报告；单位负责人接到报告后应当于1小时内上报事故情况，每级上报的时间不得超过2小时。","s":"第一部分（一）2.1.1 补充知识：事故等级划分及报告规定"},{"id":"A02-010","t":"judge","c":"A02","q":"事故企业其他副职和相关部门履行了报告职责的，可以替代第一责任人履行报告责任。","o":["正确","错误"],"a":1,"e":"手册特别强调：事故企业其他副职和相关部门履行报告职责，均替代不了第一责任人履行报告的责任。","s":"第一部分（一）2.1.1 特别强调（2）"},{"id":"A02-011","t":"single","c":"A02","q":"关于事故报告，国内有人员重伤或死亡及经济损失100万元以上的事故，事故单位应在多长时间内向事故发生地县级以上人民政府安监部门报告？","o":["1小时内","2小时内","4小时内","24小时内"],"a":0,"e":"手册规定：国内有人员重伤或死亡及经济损失100万元以上的事故，事故单位1小时内向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的相关部门报告。","s":"第一部分（一）2.1.1 补充知识（1）"},{"id":"A02-012","t":"single","c":"A02","q":"安全技术支撑体系的基本要求是，各级主要技术负责人负有什么权力？","o":["安全生产技术决策和指挥权","安全生产一票否决权","安全生产费用审批权","安全事故调查处理权"],"a":0,"e":"手册规定：安全技术支撑体系的基本要求是各级主要技术负责人负有安全生产技术决策和指挥权，按照“技术先行”的要求，负责安全技术方案的编制、评审、交底及检查落实。","s":"第一部分（一）2.2安全技术支撑体系 基本要求"},{"id":"A02-013","t":"single","c":"A02","q":"在建项目总工程师应多久至少组织开展一次安全技术支撑体系的履职检查工作？","o":["每季度至少一次","每年至少一次","每月至少一次","每半年至少一次"],"a":0,"e":"手册规定：在建项目总工程师应建立健全项目安全技术支撑体系各级负责人履职清单，每季度至少组织开展一次本体系的履职检查工作。","s":"第一部分（一）2.2.2.1总工程师（2）"},{"id":"A02-014","t":"single","c":"A02","q":"安全生产实施体系落实的“五同时”是指：","o":["计划、布置、检查、总结、评比生产工作时同时计划、布置、检查、总结、评比安全工作","计划、实施、检查、改进、验收","组织、指挥、协调、控制、监督","教育、交底、检查、整改、验收"],"a":0,"e":"手册规定：在计划、布置、检查、总结、评比生产工作的时候，同时计划、布置、检查、总结、评比安全生产工作。","s":"第一部分（一）2.3.1 分管生产副总经理 2）"},{"id":"A02-015","t":"single","c":"A02","q":"企业总部分管生产副总经理组织制定本体系履职清单后，应至少多久开展一次本体系的履职检查工作？","o":["每年至少一次","每季度至少一次","每月至少一次","每半年至少一次"],"a":0,"e":"手册规定：分管生产副总经理组织制定本体系履职清单，每年至少开展一次本体系的履职检查工作（在建项目生产副经理为每季度至少一次）。","s":"第一部分（一）2.3.1.1 分管生产副总经理 1）（3）"},{"id":"A02-016","t":"single","c":"A02","q":"安全监督管理体系主要包括各级分管安全副总经理、安全总监、安全管理部门主任以及：","o":["工区（厂、队、车间）安全负责人、班组安全员","项目经理、项目总工","班组长、技术员","专职安全员、兼职安全员"],"a":0,"e":"手册规定：安全监督管理体系主要包括各级分管安全生产副总经理、安全总监、安全管理部门主任、工区（厂、队、车间）安全负责人、班组安全员等。","s":"第一部分（一）2.4安全监督管理体系"},{"id":"A02-017","t":"single","c":"A02","q":"安全总监的安全职责及履职清单共有：","o":["10项职责22项履职清单","9项职责25项履职清单","8项职责18项履职清单","7项职责31项履职清单"],"a":0,"e":"手册明确：安全总监安全职责及履职清单为10项职责22项履职清单。","s":"第一部分（一）2.4.1.2安全总监"},{"id":"A02-018","t":"judge","c":"A02","q":"企业总部安全检查发现的重大隐患必须向安全生产实施体系责任人汇报。","o":["正确","错误"],"a":0,"e":"手册在安全生产实施体系部分注明：企业总部安全检查发现的重大隐患必须向实施体系责任人汇报。","s":"第一部分（一）2.3.1.1 生产管理部门主任 注"},{"id":"A02-019","t":"single","c":"A02","q":"各级党组织书记在安全生产方面应每年至少检查几次安全生产与职业健康宣传教育工作？","o":["1次","2次","4次","12次"],"a":0,"e":"手册规定：党组织书记每年至少检查1次安全生产与职业健康宣传教育工作，并将安全生产工作纳入党委工作考核内容，实行安全生产“一票否决”。","s":"第一部分（一）2.5党组织书记（4）③"},{"id":"A02-020","t":"single","c":"A02","q":"总经理在事故报告方面的职责是：","o":["签发事故报表（零事故报表也应签批）","直接向国务院报告","由安全管理部门代签即可","无需签批事故报表"],"a":0,"e":"手册规定：总经理应签发事故报表（零事故报表也应签批），并提醒董事长、督促主管部门按规定报告生产安全事故。","s":"第一部分（一）2.1.2 总经理 8）（17）（18）"},{"id":"A02-021","t":"single","c":"A02","q":"关于安全生产“四不放过”原则的适用，下列说法符合手册的是：","o":["董事长成立事故调查组，按“四不放过”原则组织开展事故调查、责任追究","“四不放过”仅适用于隐患整改","“四不放过”由安全总监单独执行","“四不放过”是指事故调查不需要追究责任"],"a":0,"e":"手册规定：董事长收到事故报告后成立事故调查组，按照“四不放过”原则组织开展事故调查、责任追究；项目安全总监也应按“四不放过”原则组织制订防范措施。","s":"第一部分（一）2.1.1 7）（30）；2.4.2.1（10）"},{"id":"A02-022","t":"single","c":"A02","q":"在建项目安全总监在生产安全事故调查处理中的职责是：","o":["主持召开事故分析会议，按“四不放过”原则组织制订防范措施，向项目经理报告调查处理情况","直接向股份公司报告事故即可","只负责保护现场，不参与调查","负责事故的对外信息发布"],"a":0,"e":"手册规定：项目安全总监负责生产安全事故调查与处理工作，主持召开事故分析会议，并按“四不放过”的原则组织制订防范措施，追查事故责任，提出处理意见，向项目经理报告调查处理情况。","s":"第一部分（一）2.4.2.1 安全总监（10）"},{"id":"A05-001","t":"single","c":"A05","q":"企业总部安全生产规章制度应以正式文件发布，并经谁签发？","o":["第一责任人","安全总监","分管安全领导","安委会主任"],"a":0,"e":"手册规定：应按要求建立覆盖全业务范围的安全生产与职业健康配套制度，以正式文件并经第一责任人签发，重要的安全制度须经安委会审议。","s":"第一部分（一）5.规章制度 5.1（1）"},{"id":"A05-002","t":"single","c":"A05","q":"企业应至少多久评估一次规章制度的适用性、有效性和执行情况？","o":["每年至少一次","每半年一次","每两年一次","每季度一次"],"a":0,"e":"手册规定：企业应每年至少评估一次规章制度的适用性、有效性和执行情况；项目部每年也应至少评估一次。","s":"第一部分（一）5.规章制度 5.1（5）、5.2（7）"},{"id":"A05-003","t":"single","c":"A05","q":"项目部规章制度应以正式文件发布，并经谁签发？","o":["项目经理","项目安全总监","项目总工程师","企业第一责任人"],"a":0,"e":"手册规定：项目规章制度以正式文件并经项目经理签发，重要的管理制度须经安委会审议通过。","s":"第一部分（一）5.规章制度 5.2（3）"},{"id":"A05-004","t":"single","c":"A05","q":"截至2022年，股份公司安全生产与职业健康规章制度清单共42项，其中包括19个制度、8个标准、2个规程、7个强制规定和：","o":["4个应急预案","6个应急预案","3个应急预案","5个应急预案"],"a":0,"e":"手册明确：截至2022年，股份公司共计制定了19个安全生产管理办法、8个标准、2个规程、4个应急预案、7个强制规定，共计42项。","s":"第一部分（一）5.规章制度 补充知识（3）"},{"id":"A05-005","t":"judge","c":"A05","q":"监理项目部应编制安全监理方案和安全监理实施细则。","o":["正确","错误"],"a":0,"e":"手册规定：监理项目部应编制安全监理方案和安全监理实施细则。","s":"第一部分（一）5.规章制度 5.2（9）"},{"id":"A05-006","t":"single","c":"A05","q":"项目部结合项目安全风险分类制定专项制度，手册举例说明：","o":["有氨气的项目，需要制定氨气专项安全管理办法","所有项目统一使用企业总部制度即可","项目部不需要单独制定制度","专项制度由分包单位自行制定"],"a":0,"e":"手册规定：项目部应结合项目安全风险，分类制定专项制度（如：有氨气的项目，需要制定氨气专项安全管理办法）。","s":"第一部分（一）5.规章制度 5.2（2）"},{"id":"A06-001","t":"single","c":"A06","q":"企业总部安全操作规程的编制与签发要求是：","o":["技术部门组织编制，经企业技术负责人审核、第一责任人签批，由技术部门发布发放","安全部门单独编制并由安全总监签发","设备部门编制并由分管领导签发","由项目部编制后报企业备案"],"a":0,"e":"手册规定：技术部门组织设备、安全部门及相关生产部门编制相关安全操作规程，经企业技术负责人审核、第一责任人签批，由技术部门负责发布、发放。","s":"第一部分（一）6.安全操作规程 6.1（1）"},{"id":"A06-002","t":"single","c":"A06","q":"“四新”（新技术、新材料、新工艺、新设备设施）投入使用前，项目部应：","o":["组织编制或修订相应的安全操作规程","只需对作业人员进行口头交底","沿用原操作规程即可","报企业总部审批后使用"],"a":0,"e":"手册规定：“四新”投入使用前，项目部应组织编制或修订相应的安全操作规程。","s":"第一部分（一）6.安全操作规程 6.2（2）"},{"id":"A06-003","t":"single","c":"A06","q":"机械设备安全操作规程应如何处理？","o":["在机械设备上张贴","由操作人员自行保管","存档于项目资料室即可","发放至安全管理部门"],"a":0,"e":"手册规定：机械设备安全操作规程应在机械设备上张贴（抽查是否与发布文本一致），岗位安全操作规程应发放到相关岗位、人员，并组织相应的培训。","s":"第一部分（一）6.安全操作规程 6.2（3）"},{"id":"A06-004","t":"single","c":"A06","q":"企业应至少多久开展一次安全操作规程的适用性、有效性和执行情况评估？","o":["每年至少一次","每季度一次","每半年一次","每两年一次"],"a":0,"e":"手册规定：企业应每年至少开展一次安全操作规程的适用性、有效性和执行情况的评估，结合评估情况修订完善，并建立相关记录。","s":"第一部分（一）6.安全操作规程 6.1（4）"},{"id":"A07-001","t":"single","c":"A07","q":"手册对安全会议的基本要求是：每年召开一次年度安全生产工作会议，党政班子至少召开一次研究安全生产工作的会议，以及：","o":["每年召开至少两次安委会会议","每季度召开一次安全专题会","每月召开一次党委会","每周召开一次安全例会"],"a":0,"e":"手册规定：每年召开一次年度安全生产工作会议，党政班子至少召开一次研究安全生产工作的会议，每年召开至少两次安委会会议并认真落实各项会议决议。","s":"第一部分（一）7.安全会议 基本要求"},{"id":"A07-002","t":"judge","c":"A07","q":"安委会会议必须专题研究安全生产工作，严禁研究非安全生产工作，且签到严禁代签。","o":["正确","错误"],"a":0,"e":"手册规定：安委会应编制会议议程、参会人员签到（严禁代签），会后形成会议纪要并发布落实；必须专题研究安全生产工作，严禁研究非安全生产工作。","s":"第一部分（一）7.安全会议 7.1（2）①②"},{"id":"A07-003","t":"single","c":"A07","q":"项目部安全生产月度会的要求中，下列说法正确的是：","o":["必须由项目经理主持，各部门按“一岗双责”要求分别谈安全","由安全总监主持即可","可与调度会套开且无需单独记录纪要","只有安全部门谈安全即可"],"a":0,"e":"手册规定：项目部安全生产月度会可与调度会等套开，但记录、纪要必须单独整理发布；杜绝只有安全部门谈安全，各部门要按“一岗双责”要求分别谈安全，会议必须要由项目经理主持。","s":"第一部分（一）7.安全会议 7.2（1）"},{"id":"A07-004","t":"single","c":"A07","q":"项目部安全生产周例会应由谁主持？","o":["安全总监","项目经理","生产副经理","安全管理部门主任"],"a":0,"e":"手册规定：安全生产周例会应由安全总监主持，参会人员主要为安全管理人员（含分包单位）。","s":"第一部分（一）7.安全会议 7.2（2）"},{"id":"A07-005","t":"single","c":"A07","q":"项目部安委会会议的召开频次要求是：","o":["每季度召开一次","每年召开一次","每月召开一次","每半年召开一次"],"a":0,"e":"手册规定：项目部每年召开一次安全生产工作会议，每季度召开一次安委会会议（除研究部署项目安全生产工作外，还要传达落实上级安全生产工作要求）。","s":"第一部分（一）7.安全会议 7.2"},{"id":"A08-001","t":"single","c":"A08","q":"企业总部安全教育培训计划应由谁签发？","o":["第一责任人","安全总监","人力资源部门负责人","分管安全领导"],"a":0,"e":"手册规定：企业总部安全教育培训计划可纳入企业员工教育培训计划，培训计划由第一责任人签发。","s":"第一部分（一）8.教育培训 8.1（1）"},{"id":"A08-002","t":"single","c":"A08","q":"安全生产培训档案内容不包括下列哪一项？","o":["员工个人工资明细","培训计划（大纲）","学员名册、考试成绩","培训效果评价记录"],"a":0,"e":"手册规定：培训责任部门应建立安全生产培训档案，内容主要包括培训计划（大纲）、课程安排、授课老师、学员名册、考试成绩、培训效果评价记录等。","s":"第一部分（一）8.教育培训 8.1（2）"},{"id":"A08-003","t":"judge","c":"A08","q":"事故单位应针对安全事故制作事故警示教育片，开展针对性专项培训。","o":["正确","错误"],"a":0,"e":"手册规定：事故单位应针对安全事故制作事故警示教育片，开展针对性专项培训，培训内容应和所发生事故对应。","s":"第一部分（一）8.教育培训 8.1（5）"},{"id":"A08-004","t":"single","c":"A08","q":"项目部应将分包商员工纳入培训范畴，实施的培训不包括：","o":["学历提升培训","入场、复工培训","岗前、转岗培训","“四新”培训"],"a":0,"e":"手册规定：项目部应将分包商员工纳入培训范畴，实施入场、复工、岗前、转岗、“四新”、现场管理骨干等培训，并建立齐全的培训记录。","s":"第一部分（一）8.教育培训 8.2（3）"},{"id":"A08-005","t":"single","c":"A08","q":"新入场人员三级安全教育学时一般为：","o":["公司15学时、项目15学时、班组20学时","公司20学时、项目15学时、班组15学时","公司15学时、项目20学时、班组15学时","三级各15学时"],"a":0,"e":"手册培训学时表规定：新入场人员三级安全教育为公司15学时、项目15学时、班组20学时。","s":"第一部分（一）8.教育培训 补充知识（2）培训学时"},{"id":"A08-006","t":"single","c":"A08","q":"股份公司安全生产教育培训工作的归口管理部门是：","o":["各级人力资源部","安全管理部门","工程技术部门","总经理工作部"],"a":0,"e":"手册规定：股份公司安全生产教育培训工作按照“统一规划、归口管理、分级负责、分类实施”的原则开展，各级人力资源部是教育培训工作的归口管理部门，安全管理部门是安全教育培训工作的实施和监督部门。","s":"第一部分（一）8.教育培训 补充知识（1）②（A）"},{"id":"A09-001","t":"single","c":"A09","q":"企业安全生产费用预算应由相关部门会签，并经谁签发？","o":["第一责任人","总会计师","安全总监","分管安全领导"],"a":0,"e":"手册规定：企业应制定安全费用预算，预算应由相关部门会签，经第一责任人签发。","s":"第一部分（一）9.安全生产费用 9.1（1）"},{"id":"A09-002","t":"single","c":"A09","q":"项目部安全生产费用报销凭证应经哪个部门审核签认？","o":["安全管理部门","财务部门","工程技术部门","物资设备部门"],"a":0,"e":"手册规定：项目部财务部门建立安全生产费用统计台账，安全生产费用报销凭证应经安全管理部门审核签认，确保在规定范围内使用。","s":"第一部分（一）9.安全生产费用 9.2（2）"},{"id":"A09-003","t":"judge","c":"A09","q":"安全管理人员工资、保险、事故善后赔补等可以列入安全生产费用。","o":["正确","错误"],"a":1,"e":"手册明确规定：安全管理人员工资、保险、事故善后赔补等不能列入安全费用。","s":"第一部分（一）9.安全生产费用 补充知识 注"},{"id":"A09-004","t":"judge","c":"A09","q":"作业现场安全防护设施设置、隐患整改治理等非货币费用应纳入安全费用统计范畴。","o":["正确","错误"],"a":0,"e":"手册规定：作业现场安全防护设施设置、隐患整改治理等非货币费用应纳入安全费用统计范畴。","s":"第一部分（一）9.安全生产费用 9.2（4）"},{"id":"A09-005","t":"single","c":"A09","q":"实行总承包施工的，安全生产费用统计的正确做法是：","o":["总包单位和分包单位不得重复统计","总包单位和分包单位各自全额统计","只由分包单位统计","只由建设单位统计"],"a":0,"e":"手册规定：实行总承包施工的，总包单位和分包单位不得重复统计安全生产费用；由公司外单位承担分包任务的，总包单位应将支付给公司外分包单位的安全生产费用统计到总包单位统计报表中。","s":"第一部分（一）9.安全生产费用 补充知识（2）②"},{"id":"A09-006","t":"single","c":"A09","q":"分包安全生产费用的拨付应如何处理？","o":["以合同形式进行约定，及时结算拨付并保存记录","由分包单位申请后现金支付","由项目部自行决定","在工程结算时一并支付即可"],"a":0,"e":"手册规定：分包安全生产费用的拨付应以合同形式进行约定，应及时结算予以拨付并保存相关记录，应对分包安全费用使用情况进行有效管控。","s":"第一部分（一）9.安全生产费用 9.2（3）"},{"id":"A10-001","t":"single","c":"A10","q":"企业二级生产经营单位对所属项目安全生产标准化年抽检比例不低于：","o":["项目总数的50%","项目总数的30%","项目总数的70%","项目总数的100%"],"a":0,"e":"手册规定：企业二级生产经营单位对所属项目安全标准化年抽检比例不低于项目总数的50%；各项目部100%开展安全生产标准化自查自纠。","s":"第一部分（一）10.安全生产标准化 10.1 注"},{"id":"A10-002","t":"single","c":"A10","q":"企业对所属项目安全生产标准化年抽检项目部总数不低于：","o":["7个","5个","10个","3个"],"a":0,"e":"手册规定：企业对所属项目安全标准化年抽检项目部总数不低于7个；若直管项目不足3个，则直管项目全覆盖，且抽查项目总数不少于7个。","s":"第一部分（一）10.安全生产标准化 10.1 注"},{"id":"A10-003","t":"single","c":"A10","q":"安全生产标准化项目抽查的标准是：","o":["工期半年以上的在建项目","所有在建项目","工期一年以上的项目","新开工项目"],"a":0,"e":"手册明确：项目抽查的标准为工期半年以上的在建项目。","s":"第一部分（一）10.安全生产标准化 10.1 注"},{"id":"A10-004","t":"judge","c":"A10","q":"安全生产标准化自查评工作由安全管理部门单独完成即可，主要负责人不必参与。","o":["正确","错误"],"a":1,"e":"手册规定：主要负责人（参与）应组织实施或参与标准化自查评工作，监督自评工作中重大问题的整改（签发自查评方案、主持有关会议、带队查评）。","s":"第一部分（一）10.安全生产标准化 10.1（2）"},{"id":"A10-005","t":"single","c":"A10","q":"项目部对上级标准化建设方案进行细化分解后，实施方案应包括的内容不包括：","o":["员工薪酬调整方案","标准化建设组织机构","工作重点、任务分解","开展的具体措施、时限要求"],"a":0,"e":"手册规定：项目部应对标准化建设方案进行细化、分解，方案应包括标准化建设组织机构、工作重点、任务分解以及如何开展的具体措施、时限要求等内容。","s":"第一部分（一）10.安全生产标准化 10.2（1）"},{"id":"A11-001","t":"single","c":"A11","q":"危险性较大的分部分项工程专项施工方案应由谁审批？","o":["施工企业技术负责人","项目经理","项目总工程师","总监理工程师"],"a":0,"e":"手册说明：危险性较大的分部分项工程专项方案由施工企业技术负责人审批，企业总部应组织质量、安全、技术方面人员对其进行审核。","s":"第一部分（一）11.安全技术管理 11.1（2）说明"},{"id":"A11-002","t":"single","c":"A11","q":"超过一定规模的危险性较大的分部分项工程专项施工方案专家论证会，专家组成员应为：","o":["5名及以上符合相关专业要求的专家","3名及以上专家","7名及以上专家","由施工单位自行确定人数"],"a":0,"e":"手册规定：专家论证会专家组成员应当由5名及以上符合相关专业要求的专家组成，项目参建各方人员不得以专家身份参加，专家应有15年以上专业年限、具有高级技术职称。","s":"第一部分（一）11.安全技术管理 补充知识（2）（B）"},{"id":"A11-003","t":"single","c":"A11","q":"专项施工方案专家论证后，专家组应提出的意见是：","o":["通过、修改后通过或者不通过的一致意见","仅提出修改建议即可","由施工单位自行判定是否通过","由监理单位决定是否通过"],"a":0,"e":"手册引用住建部令：专家论证会后应当形成论证报告，对专项施工方案提出通过、修改后通过或者不通过的一致意见，专家对论证报告负责并签字确认。","s":"第一部分（一）11.安全技术管理 补充知识（2）（B）"},{"id":"A11-004","t":"single","c":"A11","q":"专项施工方案实施前的安全技术交底，正确的做法是：","o":["编制人员或项目技术负责人向现场管理人员交底，现场管理人员向作业人员交底，双方和项目专职安全生产管理人员共同签字确认","只需向班组长交底即可","由安全部门单独交底","交底记录可由他人代签"],"a":0,"e":"手册规定：专项施工方案实施前，编制人员或者项目技术负责人向施工现场管理人员进行方案交底；施工现场管理人员向作业人员进行安全技术交底，交底双方和项目专职安全生产管理人员共同在交底记录中签字确认，严禁代签。","s":"第一部分（一）11.安全技术管理 11.2（4）"},{"id":"A11-005","t":"judge","c":"A11","q":"施工单位应严格按照专项施工方案组织施工，不得擅自修改、调整专项施工方案。","o":["正确","错误"],"a":0,"e":"手册规定：施工单位应严格按照专项施工方案组织施工，不得擅自修改、调整专项施工方案；确需修改的，修改后的专项施工方案应当重新审核，超过一定规模的应重新组织专家论证。","s":"第一部分（一）11.安全技术管理 补充知识（2）（D）"},{"id":"A11-006","t":"single","c":"A11","q":"按规定需要验收的危险性较大的分部分项工程，验收合格后应经谁签字方可进入下一道工序？","o":["施工单位项目技术负责人及项目总监理工程师","项目经理","安全总监","企业技术负责人"],"a":0,"e":"手册规定：验收合格的，经施工单位项目技术负责人及项目总监理工程师签字后，方可进入下一道工序。","s":"第一部分（一）11.安全技术管理 补充知识（2）（F）"},{"id":"A11-007","t":"single","c":"A11","q":"下列作业中，必须办理安全施工作业票的是：","o":["起吊重量达到起重机械额定负荷的90%及以上","普通混凝土浇筑","常规材料运输","办公区日常用电维护"],"a":0,"e":"手册规定：危险作业、动火作业施工前必须办理安全施工作业票；需办理作业票的项目包括土石方爆破、高边坡及深坑基础开挖和支护、起吊重量达到起重机械额定负荷的90%及以上、两台及以上起重机抬吊作业、受限空间作业等。","s":"第一部分（一）11.安全技术管理 补充知识⑤安全施工作业票管理"},{"id":"A11-008","t":"single","c":"A11","q":"专项施工方案实施期间，项目专职安全生产管理人员的职责是：","o":["对专项施工方案实施情况进行现场监护并记录存档，发现未按方案施工的要求立即整改","只负责记录，不干预施工","由项目总工负责监护","交由作业班组自行监督"],"a":0,"e":"手册规定：项目专职安全生产管理人员应当对专项施工方案实施情况进行现场监护，对监护情况详细记录并存档；对未按照专项施工方案施工的应当要求立即整改，并及时报告项目负责人；发现危及人身安全的紧急情况，应当立即组织作业人员撤离危险区域。","s":"第一部分（一）11.安全技术管理 补充知识（2）（E）"},{"id":"A12-001","t":"single","c":"A12","q":"年度安全检查计划须经谁签发？","o":["企业或项目第一责任人","安全总监","分管安全领导","安全管理部门主任"],"a":0,"e":"手册规定：检查考核的基本要求是制定年度安全检查计划，年度安全检查计划须经企业或项目第一责任人签发。","s":"第一部分（一）12.检查考核 基本要求"},{"id":"A12-002","t":"single","c":"A12","q":"项目部综合检查的频次要求是：","o":["每月一次，由项目主要负责人带队","每季度一次","每半年一次","每周一次"],"a":0,"e":"手册规定：项目部每月应开展一次综合检查，由项目主要负责人带队，检查结果进行通报。","s":"第一部分（一）12.检查考核 12.2（1）"},{"id":"A12-003","t":"single","c":"A12","q":"项目部春节、国庆等重要节假日检查和复工检查，应由谁带队？","o":["安全总监","项目经理","分管领导","安全管理部门主任"],"a":0,"e":"手册规定：应开展春节、国庆等重要节假日检查、复工检查，由安全总监带队，发现问题及时整改。","s":"第一部分（一）12.检查考核 12.2（3）"},{"id":"A12-004","t":"single","c":"A12","q":"企业总部开展综合检查时，手册要求必须参加的人员是：","o":["分管领导、安全总监","仅安全管理部门人员","项目经理","专职安全员"],"a":0,"e":"手册规定：分管领导、安全总监必须参加综合检查，上级有明确要求或特殊情况的，主要负责人必须参加检查。","s":"第一部分（一）12.检查考核 12.1（2）"},{"id":"A12-005","t":"single","c":"A12","q":"股份公司现行安全检查四种形式中，采取“四不两直”形式且不对检查结果打分、不纳入对子企业考核的是：","o":["回头看","检查考核","验证考核","督查"],"a":0,"e":"手册规定：股份公司现行检查分为“检查考核、验证考核、回头看、督查”四种形式；“回头看”采取“四不两直”形式，不对检查结果进行打分，不纳入对子企业的考核。","s":"第一部分（一）12.检查考核 说明（3）③"},{"id":"A12-006","t":"single","c":"A12","q":"设计咨询项目部主要负责人带队开展综合检查的频次要求是：","o":["至少每季度一次","每月一次","每半年一次","每年一次"],"a":0,"e":"手册规定：设计咨询项目部主要负责人应至少每季度带队开展一次综合检查，月安全检查可由项目现场负责带队实施。","s":"第一部分（一）12.检查考核 12.2（6）"},{"id":"A12-007","t":"single","c":"A12","q":"成员企业综合检查的频次要求是：","o":["每年不得少于两次","每年不得少于一次","每季度一次","每月一次"],"a":0,"e":"手册规定：项目部每月应在施工现场组织一次综合检查；成员企业根据需要安排综合检查的次数和范围，但每年不得少于两次。","s":"第一部分（一）12.检查考核 补充知识（3）"},{"id":"A12-008","t":"judge","c":"A12","q":"各项安全检查均须确定检查标准、建立完整的检查记录，检查及被检查双方须签字，整改闭合资料须附有相应的图片。","o":["正确","错误"],"a":0,"e":"手册说明：各项检查均须确定检查标准、建立完整的检查记录、检查及被检查双方须签字、整改闭合资料须附有相应的图片、整改回执受检方负责人必须签字。","s":"第一部分（一）12.检查考核 说明（1）"},{"id":"A13-001","t":"single","c":"A13","q":"企业总部应至少多久组织开展一次全面、系统的安全风险识别、评价工作？","o":["每年至少一次","每季度一次","每半年一次","每月一次"],"a":0,"e":"手册规定：企业总部每年至少组织开展一次全面、系统的安全风险识别、评价工作，确定各级各类风险的控制措施，分级建立安全风险分级管控清单。","s":"第一部分（一）13.风险分级管控 13.1（2）"},{"id":"A13-002","t":"single","c":"A13","q":"项目部应至少多久对较大（二级）及以上安全风险管控清单进行更新？","o":["每月","每季度","每半年","每年"],"a":0,"e":"手册规定：项目部建立安全风险分级管控清单，至少每月对较大（二级）及以上安全风险管控清单进行更新；子企业总部至少每季度对重大（一级）风险管控清单更新，子企业二级单位至少每季度对较大（二级）及以上更新。","s":"第一部分（一）13.风险分级管控 13.2（2）"},{"id":"A13-003","t":"single","c":"A13","q":"安全风险等级从高到低划分及对应颜色标示，正确的是：","o":["重大风险（一级）红、较大风险（二级）橙、一般风险（三级）黄、低风险（四级）蓝","重大风险红、较大风险黄、一般风险橙、低风险蓝","重大风险橙、较大风险红、一般风险黄、低风险蓝","四级风险全部用红色标示"],"a":0,"e":"手册规定：安全风险等级从高到低划分为重大风险（一级）、较大风险（二级）、一般风险（三级）和低风险（四级），分别用红、橙、黄、蓝四种颜色标示。","s":"第一部分（一）13.风险分级管控 补充知识（1）⑥"},{"id":"A13-004","t":"single","c":"A13","q":"存在能量意外释放（剧毒、爆炸、火灾、坍塌、地质灾害等）危险的场所或区域，且作业人员或区域内人员达到多少人及以上，应列为重大（一级）风险？","o":["10人及以上","5人及以上","20人及以上","30人及以上"],"a":0,"e":"手册规定：存在能量意外释放危险的场所或区域，且作业人员或区域内人员在10人及以上的，应列为重大（一级）风险。","s":"第一部分（一）13.风险分级管控 补充知识（4）④"},{"id":"A13-005","t":"judge","c":"A13","q":"上一级负责管控的风险，下一级必须同时负责具体管控并逐级落实控制措施。","o":["正确","错误"],"a":0,"e":"手册规定：上一级负责管控的风险，下一级必须同时负责具体管控并逐级落实控制措施。","s":"第一部分（一）13.风险分级管控 补充知识（3）注"},{"id":"A13-006","t":"single","c":"A13","q":"双重预防机制中，“第一道防火墙”管风险和“第二道防火墙”治隐患的准确表述是：","o":["第一道是管风险，以安全风险辨识和管控为基础；第二道是治隐患，以隐患排查和治理为手段","第一道是治隐患，第二道是管风险","两道都是隐患排查","两道都是风险辨识"],"a":0,"e":"手册规定：双重预防机制第一道是管风险，以安全风险辨识和管控为基础，从源头上系统辨识风险、分级管控风险；第二道是治隐患，以隐患排查和治理为手段，把隐患消灭在事故发生之前。","s":"第一部分（一）13.风险分级管控 补充知识（5）"},{"id":"A13-007","t":"single","c":"A13","q":"风险公示告知要求中，针对哪一级以上安全风险应设置风险公告栏或告知牌？","o":["较大（二级）及以上","重大（一级）","一般（三级）及以上","所有等级风险"],"a":0,"e":"手册规定：针对较大（二级）及以上安全风险设置风险公告栏或告知牌等，注明风险等级、可能后果、控制措施、管控层级和责任人等信息。","s":"第一部分（一）13.风险分级管控 13.2（5）"},{"id":"A14-001","t":"single","c":"A14","q":"企业总部应结合安全检查每年至少组织开展几次隐患排查治理活动？","o":["两次","一次","四次","每月一次"],"a":0,"e":"手册规定：企业总部应结合安全检查每年至少组织开展两次隐患排查治理活动，活动前应制定具有针对性、操作性的隐患排查治理活动方案。","s":"第一部分（一）14.隐患排查治理 14.1（2）"},{"id":"A14-002","t":"single","c":"A14","q":"对排查出的事故隐患下达整改通知书后，应按照什么原则进行整改验收？","o":["“五定”原则","“四不放过”原则","“三同时”原则","“一岗双责”原则"],"a":0,"e":"手册规定：对排查出的事故隐患应下达事故隐患整改通知书，按照“五定”原则进行整改验收。","s":"第一部分（一）14.隐患排查治理 14.1（2）、14.2（2）"},{"id":"A14-003","t":"single","c":"A14","q":"项目部应按时上报的隐患报表不包括：","o":["安全生产费用月报表","安全生产事故隐患排查治理情况月报表","安全生产事故隐患排查治理情况季度分析报告","安全生产重大事故隐患信息报告单"],"a":0,"e":"手册规定：应按时上报《安全生产事故隐患排查治理情况月报表》《安全生产事故隐患排查治理情况季度分析报告》《安全生产重大事故隐患信息报告单》。","s":"第一部分（一）14.隐患排查治理 14.2（5）"},{"id":"A14-004","t":"single","c":"A14","q":"隐患因素不包括下列哪一项？","o":["自然灾害不可抗力","物的危险状态","人的不安全行为","管理上的缺陷"],"a":0,"e":"手册明确隐患因素为：物的危险状态、人的不安全行为、管理上的缺陷（部分表述还包括环境因素）。","s":"第一部分（一）14.隐患排查治理 补充知识（2）隐患因素"},{"id":"A14-005","t":"judge","c":"A14","q":"对重大隐患应按规定建立档案并上报备案，实行挂牌督办。","o":["正确","错误"],"a":0,"e":"手册规定：按规定建立重大隐患档案并上报备案，对重大隐患应挂牌督办（重大隐患档案、备案及上报记录，重大隐患挂牌、督办、治理、验收等记录）。","s":"第一部分（一）14.隐患排查治理 14.1（4）"},{"id":"A14-006","t":"single","c":"A14","q":"关于“问题”与“隐患”的区别，下列说法正确的是：","o":["隐患是在生产经营活动中存在可能导致事故发生或导致事故后果扩大的物的不安全状态、人的不安全行为和管理上的缺陷","问题就是隐患，二者没有区别","隐患只指设备故障","问题比隐患更严重"],"a":0,"e":"手册规定：问题是安全生产现状与有关法律法规、标准规范、规章制度规定之间的差距；隐患是在生产经营活动中存在可能导致事故发生或导致事故后果扩大的物的不安全状态、人的不安全行为和管理上的缺陷、环境因素。","s":"第一部分（一）14.隐患排查治理 补充知识（1）⑥"},{"id":"A15-001","t":"single","c":"A15","q":"特种设备管理台账的覆盖范围应为：","o":["自有、甲供、分包自带、租赁的特种设备全部纳入","仅自有设备","仅自有和租赁设备","仅大型设备"],"a":0,"e":"手册基本要求：建立特种设备（含自有、甲供、分包自带、租赁）管理台账，定期开展特种设备专项检查，掌握特种设备依法检验情况，特种设备作业人员持证上岗。","s":"第一部分（一）15.特种设备管理 基本要求"},{"id":"A15-002","t":"single","c":"A15","q":"特种设备经有资质的检验机构检验合格后，应在什么时限内办理登记手续？","o":["投入使用前或者投入使用后30日内","投入使用后60日内","投入使用后90日内","投入使用后一年内"],"a":0,"e":"手册规定：特种设备应经有资质的检验机构进行检验，检验合格后在投入使用前或者投入使用后30日内，向政府规定部门办理登记手续，并按规定进行定期检验。","s":"第一部分（一）15.特种设备管理 15.2（4）"},{"id":"A15-003","t":"single","c":"A15","q":"按照股份公司《特种设备管理办法》，起重设备超过多少台或各类特种设备（不含气瓶）总量多少台以上的项目应配备专职特种设备安全管理员？","o":["起重设备超过10台，或特种设备总量20台以上（含20台）","起重设备超过5台，或总量10台以上","起重设备超过20台，或总量30台以上","所有项目均须配备专职管理员"],"a":0,"e":"手册规定：起重设备超过10台或各类特种设备（不含气瓶）总量20台以上（含20台）的项目也应配备专职特种设备安全管理员。","s":"第一部分（一）15.特种设备管理 补充知识 第十一条"},{"id":"A15-004","t":"single","c":"A15","q":"特种设备发生重大及以上设备事故，应在多长时间内报告股份公司设备物资部？","o":["24小时内","1小时内","2小时内","48小时内"],"a":0,"e":"手册规定：特种设备发生重大以下设备事故由事故单位自行组织调查和处理；重大及以上设备事故必须在24小时内报告股份公司设备物资部，由股份公司设备物资部组织调查、处理。","s":"第一部分（一）15.特种设备管理 补充知识 第四十条"},{"id":"A15-005","t":"judge","c":"A15","q":"从事特种设备安装、拆除、改造、维修的单位，可以以专业分包形式将相关业务再分包给其他单位。","o":["正确","错误"],"a":1,"e":"手册规定：从事特种设备安装、拆除、改造、维修的单位不得以任何形式对其安装、拆除、改造、维修业务进行转包或者分包。","s":"第一部分（一）15.特种设备管理 补充知识 第二十一条"},{"id":"A15-006","t":"single","c":"A15","q":"关于甲供、承租、分包队伍自带的特种设备管理，正确的做法是：","o":["纳入本单位特种设备管理体系进行管理","由产权单位自行管理，使用单位不负责","只需在使用前检查一次即可","由监理单位统一管理"],"a":0,"e":"手册规定：特种设备承租前应检查设备是否具有相关机构的特种设备检验合格证并确保在有效期内；对甲供、承租、分包队伍自带的特种设备应纳入本单位特种设备管理体系进行管理。","s":"第一部分（一）15.特种设备管理 补充知识 第二十九条"},{"id":"A15-007","t":"single","c":"A15","q":"打击假冒特种作业操作证专项工作要求实现的目标为：","o":["特种作业人员依法持证上岗率100%、证书核查率100%、网上验证率100%","持证上岗率95%以上即可","只需核查分包队伍人员证书","证书核查由作业人员自行负责"],"a":0,"e":"手册引用中电建股安环〔2018〕18号文：做到特种作业人员依法持证上岗率100%、证书核查率100%、网上验证率100%。","s":"第一部分（一）15.特种设备管理 补充知识（2）"},{"id":"A15-008","t":"single","c":"A15","q":"特种设备安装、拆除前应履行的程序是：","o":["安装前办理告知手续，安装拆除单位应具有相应资质，安拆方案报上级单位审批","由使用单位自行决定安装","安装后再补办手续即可","只需告知监理单位"],"a":0,"e":"手册规定：特种设备安装前应办理告知手续；安装、拆除单位应具有相应资质；安拆作业人员应具备相应资格；特种设备安拆方案应报上级单位审批，安拆过程要建立安拆记录。","s":"第一部分（一）15.特种设备管理 15.2（4）（7）"},{"id":"A16-001","t":"single","c":"A16","q":"分包管理的“四个统一”是指：","o":["统一标准、统一要求、统一培训、统一奖惩","统一合同、统一人员、统一设备、统一材料","统一管理、统一指挥、统一调度、统一核算","统一招标、统一签约、统一结算、统一评价"],"a":0,"e":"手册基本要求：按照“四个统一”（统一标准、统一要求、统一培训、统一奖惩）纳入项目体系实行“一体化介入式”管理，加强对分包商的监督、检查。","s":"第一部分（一）16.分包管理 基本要求"},{"id":"A16-002","t":"judge","c":"A16","q":"可以将产生职业病危害的作业转移给不具备职业病防护条件的分包商，只要签订安全协议即可。","o":["正确","错误"],"a":1,"e":"手册明确要求：应对分包商进行危险、职业危害告知，不得将产生职业病危害的作业转移给不具备职业病防护条件的分包商。","s":"第一部分（一）16.分包管理 基本要求、16.2（2）"},{"id":"A16-003","t":"single","c":"A16","q":"股份公司对分包商评审的频次要求是：","o":["子企业每年一次，分公司半年一次，项目部每季度一次","子企业每季度一次，项目部每月一次","只由企业总部每年评审一次","由项目部每月评审一次"],"a":0,"e":"手册规定：股份公司要求子企业每年一次，分公司半年一次，项目部每季度一次组织评审并建立记录。","s":"第一部分（一）16.分包管理 16.1（2）"},{"id":"A16-004","t":"single","c":"A16","q":"项目部对分包商评价的频次及内容要求是：","o":["每季度评价一次，且评价中应包括安全与职业健康方面的评价内容","每年评价一次，只需评价施工进度","每月评价一次，只评价质量","无需定期评价"],"a":0,"e":"手册规定：项目部每季度对分包商评价中应包括安全与职业健康方面的评价内容（评价记录）。","s":"第一部分（一）16.分包管理 16.2（8）"},{"id":"A16-005","t":"single","c":"A16","q":"存在交叉作业时，项目部应与分包商签订：","o":["交叉作业安全协议","安全生产责任书即可，无需单独协议","口头约定","由分包商之间自行协商"],"a":0,"e":"手册规定：应与分包商签订安全协议、安全生产责任书，存在交叉作业的应签订交叉作业安全协议。","s":"第一部分（一）16.分包管理 16.2（4）"},{"id":"A16-006","t":"single","c":"A16","q":"分包商员工台账应包含的信息是：","o":["姓名、性别、身份证号、工种、健康状态、联系电话、家庭住址、家庭联系电话","仅姓名和工种","姓名、身份证号和工资标准","仅需统计人数"],"a":0,"e":"手册规定：项目部应建立分包商员工台账（包含姓名、性别、身份证号、工种、健康状态、联系电话、家庭住址、家庭联系电话）。","s":"第一部分（一）16.分包管理 16.2（1）"},{"id":"A16-007","t":"single","c":"A16","q":"依据建质〔2008〕91号文，专业承包单位配备项目专职安全生产管理人员的要求是：","o":["至少1人，并根据所承担的分部分项工程的工程量和施工危险程度增加","至少2人","至少3人","可不配备"],"a":0,"e":"手册引用：专业承包单位应当配置至少1人，并根据所承担的分部分项工程的工程量和施工危险程度增加。","s":"第一部分（一）16.分包管理 补充知识（3）第十四条"},{"id":"A16-008","t":"single","c":"A16","q":"下列情形中，属于违法分包的是：","o":["施工总承包单位将工程分包给不具备相应资质的单位","专业分包单位将劳务作业分包给有资质的劳务企业","施工总承包单位将钢结构工程分包给专业单位","经建设单位同意的专业分包"],"a":0,"e":"手册引用建市规〔2019〕1号文：施工总承包单位或专业承包单位将工程分包给不具备相应资质单位的，属于违法分包；施工总承包合同范围内工程主体结构的施工分包给其他单位的（钢结构工程除外）也属于违法分包。","s":"第一部分（一）16.分包管理 补充知识（2）第十二条"},{"id":"A17-001","t":"single","c":"A17","q":"应急管理工作围绕四个方面开展，即预防与应急准备、监测与预警以及：","o":["应急处置与救援、事后恢复与重建","应急演练与评估、应急物资储备","应急队伍建设、应急资金保障","应急预案编制、应急培训"],"a":0,"e":"手册规定：按应急能力建设要求，以应急预案和应急体制、机制、法治为核心，围绕预防与应急准备、监测与预警、应急处置与救援、事后恢复与重建四个方面开展应急管理工作。","s":"第一部分（一）17.应急管理 基本要求"},{"id":"A17-002","t":"single","c":"A17","q":"应急预案体系包括总体应急预案、专项应急预案、现场处置方案和：","o":["应急处置卡","应急演练方案","应急评估报告","应急物资清单"],"a":0,"e":"手册规定：应在风险评估和应急资源调查的基础上编制企业总体应急预案、专项应急预案、现场处置方案、应急处置卡，预案应按规定评审、批准实施、备案和修订。","s":"第一部分（一）17.应急管理 17.1（4）"},{"id":"A17-003","t":"single","c":"A17","q":"事故风险单一、危险性小的项目、车间，应急预案编制要求是：","o":["可以只编制现场处置方案","必须编制总体应急预案和专项预案","无需编制任何预案","只需编制应急处置卡"],"a":0,"e":"手册规定：事故风险单一、危险性小的项目、车间可以只编制现场处置方案。","s":"第一部分（一）17.应急管理 17.2（1）"},{"id":"A17-004","t":"single","c":"A17","q":"应急能力评估期已到几年的电力企业要按规定进行延期评估？","o":["五年","三年","两年","十年"],"a":0,"e":"手册规定：应在年度工作计划中对应急能力建设作出安排，应急能力评估期已到五年的电力企业要按规定进行延期评估。","s":"第一部分（一）17.应急管理 17.1（10）"},{"id":"A17-005","t":"single","c":"A17","q":"重大节日、关键时期及突发事件、汛期应急值守要求是：","o":["执行领导带班和24小时值班","正常工作时间值班即可","由安全部门安排人员值守","只需保持电话畅通"],"a":0,"e":"手册规定：应制定并实施重大节日、关键时期及突发事件、汛期应急值守制度，关键时期执行领导带班和24小时值班，遇到突发事件，第一时间报告、第一时间响应、第一时间处置。","s":"第一部分（一）17.应急管理 17.1（11）"},{"id":"A17-006","t":"judge","c":"A17","q":"项目部应赋予现场指挥人员、带班人员、调度人员相应的避险权限，并设置相应的避险场所、避险设施。","o":["正确","错误"],"a":0,"e":"手册规定：应赋予现场指挥人员、带班人员、调度人员相应的避险权限，并应设置相应的避险场所、避险设施。","s":"第一部分（一）17.应急管理 17.2（5）"},{"id":"A17-007","t":"single","c":"A17","q":"企业总部应多久对应急投入、应急准备、应急处置与救援等工作进行一次总结评估？","o":["每年","每半年","每季度","每两年"],"a":0,"e":"手册规定：应每年对应急投入、应急准备、应急处置与救援等工作进行总结评估。","s":"第一部分（一）17.应急管理 17.1（9）"},{"id":"A17-008","t":"single","c":"A17","q":"项目部总体预案及专项预案应向谁报备？","o":["建设方有关部门","上级单位安全管理部门","当地应急管理部门","无需报备"],"a":0,"e":"手册规定：项目部总体预案及专项预案应向建设方有关部门报备（报备记录）。","s":"第一部分（一）17.应急管理 17.2（2）"},{"id":"A18-001","t":"single","c":"A18","q":"事故调查与处理应坚持的原则是：","o":["“四不放过”原则","“五定”原则","“三同时”原则","“党政同责”原则"],"a":0,"e":"手册基本要求：严格执行安全事故报告制度，按照“四不放过”的原则开展事故调查与处理工作。","s":"第一部分（一）18.事故处理 基本要求"},{"id":"A18-002","t":"single","c":"A18","q":"依据股份公司《安全事故管理办法》，除经济处罚外的事故处罚种类共有：","o":["7种","5种","3种","10种"],"a":0,"e":"手册规定：除对事故单位和个人的经济处罚外，有7种处罚：批评教育（警示谈话）、责令检查（诫勉谈话）、通报批评、警告、记过、降低岗级、撤职。","s":"第一部分（一）18.事故处理 18.1（2）注"},{"id":"A18-003","t":"judge","c":"A18","q":"事故处理中制定了整改措施即可，无需对落实情况进行闭环验证。","o":["正确","错误"],"a":1,"e":"手册规定：针对事故单位存在的问题，提出并落实事故防范措施和整改要求，制定了具体整改措施，并已落实（查闭环验证记录）。","s":"第一部分（一）18.事故处理 18.1（4）"},{"id":"A18-004","t":"single","c":"A18","q":"事故发生单位和相关单位以及有关人员应吸取教训，事故教育工作应：","o":["对事故教育提出具体要求并严格执行，开展与本事故直接相关的培训","自行学习事故通报即可","仅对责任人进行教育","由上级单位统一组织一次培训即可"],"a":0,"e":"手册规定：事故发生单位和相关单位以及有关人员应吸取教训，应对事故教育工作提出具体要求，并严格执行（与本事故直接相关的培训记录等）。","s":"第一部分（一）18.事故处理 18.1（3）"},{"id":"A19-001","t":"single","c":"A19","q":"手册中“带班”与“值班”的区别是：","o":["带班是定期巡视作业现场安全情况，值班是记录当班的安全情况","带班是夜间工作，值班是白天工作","两者含义相同","带班由安全部门负责，值班由项目经理负责"],"a":0,"e":"手册明确：带班主要是定期巡视作业现场安全情况；值班主要是记录当班的安全情况。","s":"第一部分（一）19.领导带班值班 基本要求"},{"id":"A19-002","t":"single","c":"A19","q":"节假日、重大活动、异常气候等特殊时期的领导干部值班计划应由谁审批？","o":["主要负责人","安全总监","安全管理部门主任","分管安全领导"],"a":0,"e":"手册规定：节假日、重大活动、异常气候等特殊时期的领导干部值班计划应由主要负责人审批并严格执行。","s":"第一部分（一）19.领导带班值班 19.1（1）"},{"id":"A19-003","t":"single","c":"A19","q":"项目部领导干部值班计划应经谁审批？","o":["项目经理","项目安全总监","企业分管领导","项目总工程师"],"a":0,"e":"手册规定：危险性较大的分部分项工程施工、特殊时期（主汛期、异常气候、节假日、重大活动等）情况下，应编制领导干部值班计划（经项目经理审批，计划中必须明确值班的重点部位、关键作业环节）。","s":"第一部分（一）19.领导带班值班 19.2（2）"},{"id":"A19-004","t":"judge","c":"A19","q":"项目部应建立领导安全生产轮流带班机制，确保每天都有一名项目部领导进行带班。","o":["正确","错误"],"a":0,"e":"手册规定：建立领导安全生产轮流带班机制，确保每天都有一名项目部领导进行带班；带班领导应对带班时段内全过程作业活动进行现场巡查与监督管理。","s":"第一部分（一）19.领导带班值班 19.2（3）"},{"id":"A19-005","t":"single","c":"A19","q":"项目部领导带班的主要任务不包括：","o":["审批年度安全生产费用预算","监督检查安全管理制度的落实情况","负责当班安全隐患的检查及落实整改","监督检查当班“三违”现象及处理情况"],"a":0,"e":"手册列明带班主要任务包括：解决带班问题、监督检查安全制度落实和人员上岗情况、检查督促安全技术措施落实、隐患检查整改、监督检查“三违”、检查作业环境、检查紧急避险通道、处置突发事件。费用预算审批属于董事长职责。","s":"第一部分（一）19.领导带班值班 项目部领导带班的主要任务"},{"id":"A20-001","t":"single","c":"A20","q":"有防洪度汛要求的工程，应编制防洪度汛方案和超标准洪水应急预案，方案应：","o":["经监理审批并按规定报备","由项目经理审批即可","报企业总部审批","无需审批"],"a":0,"e":"手册规定：有防洪度汛要求的工程，应编制防洪度汛方案和超标准洪水应急预案（应含现场处置方案）；方案应经监理审批并按规定报备。","s":"第一部分（一）20.防洪度汛 20.2（1）"},{"id":"A20-002","t":"single","c":"A20","q":"项目部应至少多久组织一次防汛应急演练？","o":["每年至少一次","每季度一次","每半年一次","每月一次"],"a":0,"e":"手册规定：项目部每年应至少组织一次防汛应急演练（演练记录）。","s":"第一部分（一）20.防洪度汛 20.2 ③⑤"},{"id":"A20-003","t":"single","c":"A20","q":"汛期值班要求是：","o":["领导干部到岗和重要岗位24小时值班值守","正常工作时间值班","由安全部门派人值守","每周值班一次"],"a":0,"e":"手册规定：汛期领导干部到岗和重要岗位24小时值班值守（值班记录、巡查记录）。","s":"第一部分（一）20.防洪度汛 20.2 ③"},{"id":"A20-004","t":"single","c":"A20","q":"防汛抢险救援队伍名录应注明的信息是：","o":["姓名、常住地址、专业类别、本人联系电话、至少1名直系亲属联系方式","仅姓名和电话","姓名、工种、工资标准","仅统计队伍人数"],"a":0,"e":"手册规定：防汛抢险救援队伍名录应注明姓名、常住地址、专业类别、本人联系电话、至少1名直系亲属联系方式等信息。","s":"第一部分（一）20.防洪度汛 补充知识（5）"},{"id":"A20-005","t":"single","c":"A20","q":"汛期现场人员台账应包括的基本内容是：","o":["人员姓名、性别、身份证号、现场住址、家庭住址、本人及一个家庭成员的联系电话","仅姓名与工种","姓名与进场时间","仅分包单位人员信息"],"a":0,"e":"手册规定：建立现场人员（包括分包商）台账，台账应包括人员姓名、性别、身份证号、现场住址、家庭住址、本人及一个家庭成员的联系电话等基本内容，相关信息张贴在宿舍门上。","s":"第一部分（一）20.防洪度汛 补充知识（11）"},{"id":"A20-006","t":"single","c":"A20","q":"企业总部防洪度汛工作不包括：","o":["审批项目部防洪度汛方案","每年对本单位的防洪度汛工作进行安排部署","审查防洪度汛重点单位（项目）的防洪度汛方案和超标洪水应急预案","组织开展防洪度汛、地质灾害等专项检查"],"a":0,"e":"手册规定企业总部职责为：每年安排部署、审查重点单位方案和预案、组织开展专项检查、部署实施汛期应急值守；方案由监理审批并报备。","s":"第一部分（一）20.防洪度汛 20.1"},{"id":"A21-001","t":"single","c":"A21","q":"班组班前会应突出“三交”和“三查”，其中“三交”是指：","o":["交任务、交安全、交技术措施","交任务、交质量、交进度","交人员、交设备、交材料","交图纸、交方案、交标准"],"a":0,"e":"手册补充知识明确：“三交”指交任务、交安全、交技术措施；“三查”指查工作着装、查精神状态、查个人安全防护用品。","s":"第一部分（一）21.班组活动 补充知识"},{"id":"A21-002","t":"single","c":"A21","q":"班组安全活动的频次要求是：","o":["每周必须组织一次","每月一次","每半月一次","每天一次"],"a":0,"e":"手册规定：班组每周必须组织一次安全活动，由班组长主持，分析、总结上周和计划安排下周安全生产工作。","s":"第一部分（一）21.班组活动 21.2（5）"},{"id":"A21-003","t":"single","c":"A21","q":"项目班子成员和管理人员对施工班组实行“包保”，应多久至少一次深入班组一线？","o":["每周至少一次","每月至少一次","每季度至少一次","每天一次"],"a":0,"e":"手册规定：项目班子成员和管理人员对施工班组实行“包保”，并每周至少一次深入班组一线讲安全、教方法、解难题。","s":"第一部分（一）21.班组活动 21.2（6）"},{"id":"A21-004","t":"single","c":"A21","q":"班组班后检查的重点是：","o":["是否做到“工完、料净、场地清”","设备运行记录","人员考勤","材料消耗统计"],"a":0,"e":"手册规定：班后检查是否做到“工完、料净、场地清”，是否对开关箱门、火源、闸刀、阀门等所遗留隐患进行安全处置。","s":"第一部分（一）21.班组活动 21.2（4）③"},{"id":"A21-005","t":"single","c":"A21","q":"“五清楚”中的“清楚危险源”是指：","o":["知道可能发生事故的环节、部位和应采取的防护措施，知道“三措”具体内容和应急措施","知道设备生产厂家","知道施工合同金额","知道班组成员姓名"],"a":0,"e":"手册规定：清楚危险源，即知道可能发生事故的环节、部位和应采取的防护措施，知道“三措”具体内容和应急措施。","s":"第一部分（一）21.班组活动 补充知识 五清楚③"},{"id":"A22-001","t":"single","c":"A22","q":"职业健康监护档案应覆盖员工职业健康检查的阶段是：","o":["上岗前、在岗期间和离岗时","仅上岗前","仅在岗期间","仅离岗时"],"a":0,"e":"手册规定：组织接触职业病危害因素的员工上岗前、在岗期间和离岗时的职业健康检查，并将结果及机构建议书面如实告知劳动者，建立职业健康监护档案。","s":"第一部分（一）22.职业健康 22.2（5）"},{"id":"A22-002","t":"judge","c":"A22","q":"为涉及职业病危害作业的人员提供个人职业病防护用品时，可以发放钱物替代发放职业病防护用品。","o":["正确","错误"],"a":1,"e":"手册明确规定：为涉及到职业病危害作业的人员提供个人职业病防护用品，并指导、督促作业人员正确佩戴、使用，建立发放台账（包括分包商），不得发放钱物替代发放职业病防护用品。","s":"第一部分（一）22.职业健康 22.2（7）"},{"id":"A22-003","t":"single","c":"A22","q":"作业场所8h等效声级≥85dB的噪声作业，在岗期间职业健康检查周期为：","o":["1年1次","2年1次","3年1次","半年1次"],"a":0,"e":"手册规定：作业场所8h等效声级≥85dB，1年1次；≥80dB且<85dB，2年1次。","s":"第一部分（一）22.职业健康 补充知识 表1 噪声"},{"id":"A22-004","t":"single","c":"A22","q":"建设项目的职业病防护设施与主体工程应执行“三同时”，项目部层面的要求是：","o":["职业病防护设施与主体工程同时施工","同时设计、同时施工、同时投入生产和使用由建设单位负责，项目部无需落实","竣工后补建即可","由分包单位自行决定"],"a":0,"e":"手册规定项目部：“三同时”即建设项目的职业病防护设施与主体工程同时施工（查施工进度）。","s":"第一部分（一）22.职业健康 22.2（8）"},{"id":"A22-005","t":"single","c":"A22","q":"职业病危害因素检测应委托：","o":["有相应资质的职业卫生技术服务机构","项目部自行检测即可","任意第三方检测机构","建设单位实验室"],"a":0,"e":"手册规定：按规定开展职业病危害因素监测工作，委托有相应资质的职业卫生技术服务机构，定期进行职业病危害因素检测。","s":"第一部分（一）22.职业健康 22.2（3）"},{"id":"A23-001","t":"single","c":"A23","q":"国际项目管理的基本要求是：","o":["执行所在国的安全生产与职业健康法律法规，按《国际工程HSE工作标准》开展管理工作","执行中国标准即可","由项目部自行制定标准","执行业主标准即可"],"a":0,"e":"手册规定：执行所在国的安全生产与职业健康法律法规，按《国际工程HSE工作标准》开展国际项目安全生产与职业健康管理工作。","s":"第一部分（一）23.国际项目管理 基本要求"},{"id":"A23-002","t":"single","c":"A23","q":"企业总部安全部门组织开展国际项目安全检查的频次要求是：","o":["每年不得少于1次","每半年1次","每季度1次","每两年1次"],"a":0,"e":"手册规定：安全部门组织开展国际项目安全检查每年不得少于1次。","s":"第一部分（一）23.国际项目管理 23.1（2）"},{"id":"A23-003","t":"single","c":"A23","q":"国务院国资委2019年对境外安全工作提出的“三要三不”中，不包括：","o":["安全风险不评估的，坚决不投标","安全风险不明了的，坚决不投资","缺乏安全知识和技能的人员，坚决不派出","安全生产保障体系不健全的，坚决不放过"],"a":0,"e":"手册补充知识：“三要三不”即要认真研究驻在国法律法规，安全风险不明了的坚决不投资；要加强对出国劳务人员及安全管理人员培训，缺乏安全知识和技能的人员坚决不派出；要完善与国际标准衔接的安全生产标准体系，安全生产保障体系不健全的坚决不放过。","s":"第一部分（一）23.国际项目管理 补充知识"},{"id":"A23-004","t":"single","c":"A23","q":"企业总部建立的国际工程项目应急体系，应与哪些机构建立应急协调联动机制？","o":["股份公司、区域总部、国别代表处、大使馆","仅与股份公司","仅与当地政府","仅与业主单位"],"a":0,"e":"手册规定：建立国际工程项目应急体系，企业总部与股份公司、区域总部、国别代表处、大使馆建立应急协调联动机制，保持应急渠道畅通。","s":"第一部分（一）23.国际项目管理 23.1（5）"},{"id":"A23-005","t":"judge","c":"A23","q":"国际项目部应定期开展所在国相关法律法规、标准规范适用性评价工作，形成并发布适用法律法规清单。","o":["正确","错误"],"a":0,"e":"手册规定：项目部应定期开展所在国相关法律法规、标准规范适用性评价工作，形成并发布适用法律法规清单。","s":"第一部分（一）23.国际项目管理 23.2（2）"},{"id":"A24-001","t":"single","c":"A24","q":"信息报送的基本要求是：","o":["明确信息报送责任人，及时、准确、完整上报","由安全总监个人负责报送","每季度集中报送一次","只需报送事故信息"],"a":0,"e":"手册规定：明确信息报送责任人，按规定上报安全生产与职业健康管理信息，报送应做到及时、准确、完整。","s":"第一部分（一）24.信息报送 基本要求"},{"id":"A24-002","t":"single","c":"A24","q":"企业总部应报送的报表不包括：","o":["员工工资发放月报表","生产安全事故月报表及年报表","隐患排查治理情况月报表","应急管理报表"],"a":0,"e":"手册规定：报送生产安全事故月报表及年报表、隐患排查治理情况月报表、应急管理报表、安全检查及安全管理数据报表及其他要求报送的信息。","s":"第一部分（一）24.信息报送 24.1（1）"},{"id":"A24-003","t":"judge","c":"A24","q":"事故报送应及时、准确、完整，报送流程应符合股份公司《安全事故管理办法》。","o":["正确","错误"],"a":0,"e":"手册规定：事故报送应及时、准确、完整报送事故信息，报送流程应符合股份公司《安全事故管理办法》。","s":"第一部分（一）24.信息报送 24.1（3）"},{"id":"A25-001","t":"single","c":"A25","q":"档案管理的基本要求是：","o":["明确责任人、分类管理、便于检索、真实齐全","集中存放、定期销毁","由安全部门统一保管即可","只需保存电子档案"],"a":0,"e":"手册规定：明确责任人、分类管理、便于检索、真实齐全，鼓励和支持推进档案载体电子化、数字化。","s":"第一部分（一）25.档案管理 基本要求"},{"id":"A25-002","t":"judge","c":"A25","q":"手册鼓励和支持推进安全生产档案载体电子化、数字化。","o":["正确","错误"],"a":0,"e":"手册规定：明确责任人、分类管理、便于检索、真实齐全，鼓励和支持推进档案载体电子化、数字化。","s":"第一部分（一）25.档案管理 基本要求"},{"id":"A04-009","t":"single","c":"A04","q":"年度安全生产工作计划的主要内容包括：","o":["年度工作目标、工作要点及措施，并依据年计划按月制定工作进度安排表","仅年度工作目标","仅上级部署的工作要点","仅常态化工作安排"],"a":0,"e":"手册规定：年度工作计划主要包括年度工作目标、工作要点及措施（涵盖上级部署的工作要点、本企业上年度存在主要问题和需要改进提高工作的主要措施、企业年度施工可能存在的安全管理问题的对策和工作要求、常态化工作安排），依据年计划按月制定工作进度安排表。","s":"第一部分（一）4.工作计划 补充知识（1）"},{"id":"A04-010","t":"judge","c":"A04","q":"月度计划与年度计划的最大差别是：月度计划结合各部门、岗位职责进行任务分解，具体到相关岗位、人员。","o":["正确","错误"],"a":0,"e":"手册规定：月度计划结合各部门、岗位职责进行任务分解，具体到相关岗位、人员（与年度计划的最大差别），是对年度计划的调整和补充。","s":"第一部分（一）4.工作计划 补充知识（2）"},{"id":"A05-007","t":"single","c":"A05","q":"制定安全生产规章制度的原则不包括：","o":["以制度数量多为原则","与国家的安全生产法律法规保持协调一致","覆盖安全生产的各个方面，形成体系","吸收先进经验并密切结合实际情况"],"a":0,"e":"手册规定原则：与国家法律法规保持协调一致；覆盖安全生产各个方面形成体系；吸收先进经验并密切结合实际情况；规章制度一经制定应保持严肃性和相对稳定性，不断修订完善。","s":"第一部分（一）5.规章制度 补充知识（2）"},{"id":"A05-008","t":"single","c":"A05","q":"存在职业病危害的企业，职业健康管理制度和操作规程应包括的主要内容是：","o":["职业病危害防治责任、警示与告知、项目申报、宣传教育培训、防护设施维护检修、防护用品管理、监测及评价管理、“三同时”、职业健康监护及档案管理、危害事故处置与报告、应急救援与管理等","仅职业病危害防治责任","仅防护用品管理","仅职业健康监护档案"],"a":0,"e":"手册列出13项主要内容（不限于）：职业病危害防治责任；警示与告知；项目申报；宣传教育培训；防护设施维护检修；防护用品管理；监测及评价管理；建设项目“三同时”；职业健康监护及其档案管理；危害事故处置与报告；应急救援与管理等。","s":"第一部分（一）5.规章制度 补充知识③"},{"id":"A05-009","t":"judge","c":"A05","q":"项目部直接引用上级制度的，应在汇编或发布时进行说明。","o":["正确","错误"],"a":0,"e":"手册规定：直接引用的制度应在汇编或发布时进行说明，上级制度对项目部已经明确提出管理要求的直接引用，没有对项目部提出明确要求或不能满足项目部管理要求的应制定制度或实施细则。","s":"第一部分（一）5.规章制度 5.2（1）"},{"id":"A06-005","t":"single","c":"A06","q":"安全操作规程主要分为哪两大类？","o":["岗位安全操作规程和机械设备安全操作规程","管理类和技术类","通用类和专用类","企业类和项目类"],"a":0,"e":"手册规定：建立健全安全生产与职业健康操作规程，主要分为岗位、机械设备操作等两大类。","s":"第一部分（一）6.安全操作规程 基本要求"},{"id":"A06-006","t":"judge","c":"A06","q":"安全操作规程的检查侧重于落实，主要是通过对作业人员现场作业行为来观察判断。","o":["正确","错误"],"a":0,"e":"手册规定：安全操作规程的检查侧重于落实，主要是通过对作业人员现场作业行为来观察判断。","s":"第一部分（一）6.安全操作规程 6.2（4）"},{"id":"A06-007","t":"single","c":"A06","q":"项目部在操作规程管理上应：","o":["辨识项目施工中所涉及的岗位、机械设备，在企业发布的安全操作规程基础上筛选、补充完善，建立项目操作规程清单及汇编","直接照搬企业总部版本","由分包单位自行编制","无需建立清单"],"a":0,"e":"手册规定：项目部应辨识项目施工中所涉及的岗位、机械设备，在企业发布安全操作规程基础上，筛选、补充完善适用项目的安全操作规程，并建立项目操作规程清单及汇编。","s":"第一部分（一）6.安全操作规程 6.2（1）"},{"id":"A07-006","t":"single","c":"A07","q":"企业年度安全生产工作会的召开时间和主要内容是：","o":["年初召开，对上年度安全工作进行全面总结，传达上级工作要求，安排部署本年度安全生产重点工作","年中召开","年末召开","每季度召开"],"a":0,"e":"手册规定：工作会年初召开，对上年度安全工作进行全面总结，传达上级工作要求，安排部署本年度安全生产重点工作。","s":"第一部分（一）7.安全会议 7.1（1）"},{"id":"A07-007","t":"single","c":"A07","q":"企业年度安全生产工作会的参加人员是：","o":["企业领导班子成员、安全总监、职能部门和事业部负责人、二级生产经营单位党政负责人","仅安全管理部门人员","仅领导班子成员","全体职工"],"a":0,"e":"手册规定：年度安全生产工作会参加人员为企业领导班子成员、安全总监、职能部门和事业部负责人、二级生产经营单位党政负责人。","s":"第一部分（一）7.安全会议 7.1（1）参加人员"},{"id":"A07-008","t":"single","c":"A07","q":"安委会会议应由谁主持？","o":["安委会主任","安全总监","分管安全领导","总经理工作部主任"],"a":0,"e":"手册规定：安委会由主任主持，研究解决阶段性安全生产重大事项、生产安全事故处理决定，阶段性重要工作安排部署及规章制度等。","s":"第一部分（一）7.安全会议 7.1（2）"},{"id":"A08-007","t":"single","c":"A08","q":"安全生产教育培训计划应包括的九项内容是：","o":["培训目的、内容、日期、课时、方式、对象、地点、教师、考核方式","培训目的、内容、日期","培训对象、地点、教师","培训课时、方式、考核方式"],"a":0,"e":"手册规定：安全生产教育培训计划应该包括培训目的、培训内容、培训日期、培训课时、培训方式、培训对象、培训地点、培训教师、考核方式。","s":"第一部分（一）8.教育培训 补充知识（1）①"},{"id":"A08-008","t":"single","c":"A08","q":"组织安全培训应注重针对性，遵循的原则是：","o":["缺什么培训什么、什么问题突出培训什么","按上级要求平均安排","按人数比例安排","按年度固定课程安排"],"a":0,"e":"手册规定：安全教育培训除了国家要求、执业资格规定、市场需求外，要注重培训的针对性，应按“缺什么培训什么、什么问题突出培训什么”的原则组织开展。","s":"第一部分（一）8.教育培训 补充知识（1）①"},{"id":"A08-009","t":"single","c":"A08","q":"特种作业人员培训取证、新入职员工三级安全教育培训的组织部门是：","o":["企业人力资源部门","企业安全管理部门","项目部安全管理部门","工程技术部门"],"a":0,"e":"手册规定：企业人力资源部门负责组织特种作业人员培训取证工作，负责组织新入职员工的三级安全教育培训工作；企业安全管理部门负责“三类人员”等安全职业资格培训、取证工作。","s":"第一部分（一）8.教育培训 补充知识（1）②（C）（D）"},{"id":"A09-007","t":"judge","c":"A09","q":"财务部门、安全部门应分别建立安全生产费用统计台账，安全部门应定期与财务部门核对。","o":["正确","错误"],"a":0,"e":"手册规定：财务部门、安全部门应分别建立安全生产费用统计台账，安全部门应定期与财务部门核对，监督安全费用使用的有效性。","s":"第一部分（一）9.安全生产费用 9.1（2）"},{"id":"A09-008","t":"single","c":"A09","q":"工程量式（非货币安全费用）认定中，负责对属于安全投入的工程量进行认定的部门是：","o":["工程管理部门","安全管理部门","生产管理部门","设备物资部门"],"a":0,"e":"手册规定：安全管理部门负责对属于安全投入的工程项目进行认定；工程管理部门负责对属于安全投入的工程量进行认定；生产管理部门负责零星工程量、人工、机械台班费；设备物资部门负责材料、设备的价格、折旧。","s":"第一部分（一）9.安全生产费用 补充知识（3）"},{"id":"A09-009","t":"single","c":"A09","q":"专业市场、设计、投资运营等没有政策规定的单位，安全生产费用应：","o":["按年度进行预算，不再按年度进行提取","按营业收入比例提取","按项目逐个提取","不再编制预算"],"a":0,"e":"手册规定：专业市场、设计、投资运营等没有政策规定的单位，安全生产费用应按年度进行预算，不再按年度进行提取。","s":"第一部分（一）9.安全生产费用 9.1 注"},{"id":"A10-006","t":"judge","c":"A10","q":"各企业、二级生产经营单位、项目部应逐级开展安全生产标准化年度自查评。","o":["正确","错误"],"a":0,"e":"手册规定：各企业、二级生产经营单位、项目部应逐级开展安全生产标准化年度自查评。","s":"第一部分（一）10.安全生产标准化 10.1 注"},{"id":"A10-007","t":"single","c":"A10","q":"房建项目部执行的安全生产标准化检查标准是：","o":["《建筑施工安全检查标准》（JGJ59-2011）","《施工企业安全生产评价标准》（JGJ/T77-2010）","《市政工程施工安全检查标准》（CJJ/T275-2018）","《电力建设工程安全生产标准化实施规范》"],"a":0,"e":"手册规定：房建项目部执行《建筑施工安全检查标准》（JGJ59-2011），市政项目执行《市政工程施工安全检查标准》（CJJ/T275-2018）；房建市政单位总部和二级单位执行《施工企业安全生产评价标准》（JGJ/T77-2010）。","s":"第一部分（一）10.安全生产标准化 补充知识 ④"},{"id":"A18-005","t":"single","c":"A18","q":"《刑法修正案（十一）》第一百三十四条之一规定，关闭、破坏直接关系生产安全的监控、报警、防护、救生设备设施，或篡改、隐瞒、销毁其相关数据信息，具有发生重大伤亡事故现实危险的，处：","o":["一年以下有期徒刑、拘役或者管制","三年以下有期徒刑","五年以下有期徒刑","七年以下有期徒刑"],"a":0,"e":"手册引用《刑法修正案（十一）》第一百三十四条之一：在生产、作业中违反有关安全管理的规定，具有发生重大伤亡事故或者其他严重后果的现实危险的，处一年以下有期徒刑、拘役或者管制。","s":"第一部分（一）18.事故处理 补充知识（2）"},{"id":"A18-006","t":"single","c":"A18","q":"强令他人违章冒险作业，或者明知存在重大事故隐患而不排除仍冒险组织作业，因而发生重大伤亡事故的，处：","o":["五年以下有期徒刑或者拘役；情节特别恶劣的，处五年以上有期徒刑","一年以下有期徒刑","三年以下有期徒刑","十年以上有期徒刑"],"a":0,"e":"手册引用《刑法修正案（十一）》修订的第一百三十四条第二款：处五年以下有期徒刑或者拘役；情节特别恶劣的，处五年以上有期徒刑。","s":"第一部分（一）18.事故处理 补充知识（1）"},{"id":"A24-004","t":"judge","c":"A24","q":"企业应报送上一年度安全生产与职业健康工作总结报告、应急管理工作总结报告、职业健康工作总结报告。","o":["正确","错误"],"a":0,"e":"手册规定：报送上一年度安全生产与职业健康工作总结报告、应急管理工作总结报告、职业健康工作总结报告及其他有关工作年度总结报告。","s":"第一部分（一）24.信息报送 24.1（2）"},{"id":"A25-003","t":"judge","c":"A25","q":"档案管理中，过期、作废的资料要及时处置并保留处置记录，新资料要动态更新及时建档。","o":["正确","错误"],"a":0,"e":"手册规定：过期、作废的资料要及时进行处置并保留处置记录，新资料要动态更新及时建档。","s":"第一部分（一）25.档案管理 25.1（4）"},{"id":"A25-004","t":"single","c":"A25","q":"关于电子档案的管理要求，下列说法正确的是：","o":["电子档案应通过符合安全管理要求的网络或者存储介质存储、使用、移交，并妥善保管必要的档案原件","电子档案无需保管原件","电子档案可存放在个人电脑","电子档案无需备份"],"a":0,"e":"手册规定：电子档案应当通过符合安全管理要求的网络或者存储介质存储、使用、移交，应妥善保管必要的档案原件。","s":"第一部分（一）25.档案管理 25.1（6）"},{"id":"B01-001","t":"single","c":"B01","q":"施工现场围挡高度要求是：","o":["市区主要路段不小于2.5m，一般路段不小于1.8m","所有路段均为2.0m","所有路段均为1.5m","由项目部自行确定"],"a":0,"e":"手册规定：市区主要路段工地围挡高度不小于2.5m，一般路段围挡高度不小于1.8m。","s":"第一部分（二）1.施工场地（1）"},{"id":"B01-002","t":"judge","c":"B01","q":"水利水电施工由于施工场地特殊性难以完全封闭管理，但应对重要设施、危险部位、重要作业区域进行封闭管理。","o":["正确","错误"],"a":0,"e":"手册注明：水利水电施工由于施工场地的特殊性，难以进行完全封闭管理，但应对重要设施、危险部位、重要作业区域进行封闭管理。","s":"第一部分（二）1.施工场地（1）注"},{"id":"B01-003","t":"single","c":"B01","q":"生活区功能配置要求包括：","o":["厕所、休息室、盥洗室、急救设施、应急避险场所及通道","仅宿舍和食堂","仅宿舍和厕所","由施工单位自行决定"],"a":0,"e":"手册规定：生活区功能应齐全（包括厕所、休息室、盥洗室、急救设施、应急避险场所及通道）。","s":"第一部分（二）1.施工场地（2）"},{"id":"B01-004","t":"single","c":"B01","q":"施工场地布置应遵守的规定不包括：","o":["有害与无害混合布置以节约用地","工作与生活分开","危害因素不超标","有相应的防护设施"],"a":0,"e":"手册规定应遵守有害与无害分开、工作与生活分开、危害因素不超标、有相应的防护设施等七项规定。","s":"第一部分（二）1.施工场地（2）"},{"id":"B01-005","t":"judge","c":"B01","q":"油库、炸药库应履行审批手续，单独建筑，安全距离符合规定，避雷装置可靠。","o":["正确","错误"],"a":0,"e":"手册检查要点：油库、炸药库审批手续是否齐全、是否有专项控制措施、是否单独建筑、安全距离是否符合规定、避雷装置是否可靠、防护设施是否齐全有效。","s":"第一部分（二）1.施工场地（7）"},{"id":"B02-001","t":"single","c":"B02","q":"易燃易爆物品、有毒有害物品及放射源、腐蚀性物品应：","o":["分类储藏在专用库房，与普通仓库隔离","与普通物资同库分区存放","露天存放并设置标识","由分包单位自行存放"],"a":0,"e":"手册规定：易燃易爆物品、有毒有害物品及放射源、腐蚀性等是否分类储藏在专用库房（与普通仓库隔离），采取防火、防渗等措施。","s":"第一部分（二）2.设备物资（2）"},{"id":"B02-002","t":"single","c":"B02","q":"放射源库房的布置要求是：","o":["远离作业场所和人行通道，并按有关规定严格管理","靠近作业场所便于使用","设在办公区附近","与普通仓库合并设置"],"a":0,"e":"手册规定：放射源库房是否远离作业场所和人行通道并按有关规定严格管理。","s":"第一部分（二）2.设备物资（2）"},{"id":"B02-003","t":"single","c":"B02","q":"汽油、酒精、液氨、油漆及其稀释剂等挥发性易燃物品应：","o":["密封存放","露天存放","与普通材料混放","存放在办公区"],"a":0,"e":"手册规定：汽油、酒精、液氨、油漆及其稀释剂等挥发性易燃物品是否密封存放；有相关规定的是否设置静电消除装置。","s":"第一部分（二）2.设备物资（2）"},{"id":"B02-004","t":"judge","c":"B02","q":"应急物资、器具、设备应独立存放建档，定期检查和更新，处于完好状态，做到帐物相符。","o":["正确","错误"],"a":0,"e":"手册规定：应急物资、器具、设备是否独立存放建档、是否定期检查和更新、处于完好状态、帐物是否相符、管理责任人和联系方式是否明确。","s":"第一部分（二）2.设备物资（5）"},{"id":"B02-005","t":"single","c":"B02","q":"设备物资与地面之间应采取隔离措施并设置标牌，标牌应标明：","o":["名称、数量、规格、进货日期、检验状态和责任人","仅名称和数量","仅进货日期","由仓库管理员自行确定内容"],"a":0,"e":"手册规定：与地面之间是否采取隔离措施并设置标牌，标明名称、数量、规格、进货日期、检验状态和责任人。","s":"第一部分（二）2.设备物资（4）"},{"id":"B03-001","t":"single","c":"B03","q":"手册规定应设置安全警示标志的临边部位，其高差界限是：","o":["高差超过1.5m的临边部位","高差超过1.0m","高差超过2.0m","所有临边无论高差"],"a":0,"e":"手册规定：通道口、楼梯口、电梯口和孔洞口，基坑和基槽外围、管沟和水池边沿，高差超过1.5m的临边部位等应设置安全警示标志。","s":"第一部分（二）3.安全标志（2）"},{"id":"B03-002","t":"single","c":"B03","q":"两个或更多的安全标志一起设置时，各标志之间至少应留有：","o":["标志公称尺寸0.2倍的间隙","标志公称尺寸0.5倍的间隙","10cm间隙","不留间隙"],"a":0,"e":"手册注意事项：两个或更多的安全标志一起设置时，各标志之间至少应留有标志公称尺寸0.2倍的间隙。","s":"第一部分（二）3.安全标志 注意事项①"},{"id":"B03-003","t":"single","c":"B03","q":"两个以上标志牌可以设置在一根标志杆上，但最多不能超过：","o":["4个","2个","3个","6个"],"a":0,"e":"手册注意事项：两个以上标志牌可以设置在一根标志杆上，但最多不能超过4个。","s":"第一部分（二）3.安全标志 注意事项③"},{"id":"B03-004","t":"single","c":"B03","q":"多个标志排列时应按照什么顺序排列？","o":["警告标志、禁止标志、指令标志、提示标志，先上后下、先左后右","提示、指令、禁止、警告，先下后上","随意排列","按标志尺寸大小排列"],"a":0,"e":"手册注意事项：应按照警告标志、禁止标志、指令标志、提示标志的顺序先上后下、先左后右地排列。","s":"第一部分（二）3.安全标志 注意事项④"},{"id":"B03-005","t":"single","c":"B03","q":"变配电设施及配电箱应设置的安全标志是：","o":["“当心触电”","“禁止烟火”","“必须戴安全帽”","“注意安全”"],"a":0,"e":"手册规定：变配电设施及配电箱是否设置“当心触电”等标志；电器设备试、检验或接线操作应设置“有人操作”“禁止合闸”等标志。","s":"第一部分（二）3.安全标志（7）"},{"id":"B03-006","t":"judge","c":"B03","q":"危大工程验收合格后，应在施工现场明显位置设置验收标识牌，公示验收时间及责任人员。","o":["正确","错误"],"a":0,"e":"手册规定：危大工程验收合格后，是否在施工现场明显位置设置验收标识牌，公示验收时间及责任人员。","s":"第一部分（二）3.安全标志（3）"},{"id":"B04-001","t":"single","c":"B04","q":"尘、毒、噪作业场所应在醒目位置设置公告栏，公布的内容不包括：","o":["员工工资福利标准","职业病防治的规章制度、操作规程","职业病危害事故应急救援措施","工作场所职业病危害因素检测结果"],"a":0,"e":"手册规定：是否在醒目位置设置公告栏，公布有关职业病防治的规章制度、操作规程、职业病危害事故应急救援措施和工作场所职业病危害因素检测结果。","s":"第一部分（二）4.尘、毒、噪作业（1）"},{"id":"B04-002","t":"single","c":"B04","q":"可能发生急性职业损伤的有毒、有害工作场所，应设置：","o":["报警装置","普通照明即可","通风扇","警示带"],"a":0,"e":"手册规定：可能发生急性职业损伤的有毒、有害工作场所，是否设置报警装置（原文该条被截断，属现场检查要点）。","s":"第一部分（二）4.尘、毒、噪作业（2）"},{"id":"B04-003","t":"single","c":"B04","q":"存在或产生高毒物品的作业岗位，应在醒目位置设置：","o":["高毒物品告知卡","普通警示带","安全操作规程牌","消防设施图"],"a":0,"e":"手册规定：存在或产生高毒物品的作业岗位，是否在醒目位置设置高毒物品告知卡（告知卡应载明高毒物品的名称、理化特性、健康危害、防护措施及应急处理等告知内容与警示标识）。","s":"第一部分（二）4.尘、毒、噪作业（4）"},{"id":"B04-004","t":"judge","c":"B04","q":"现场可以使用国家明令禁止使用的可能产生职业危害的设备或者材料，只要采取防护措施即可。","o":["正确","错误"],"a":1,"e":"手册检查要点明确：现场有无使用国家明令禁止使用的可能产生职业危害的设备或者材料（禁止使用）。","s":"第一部分（二）4.尘、毒、噪作业（5）"},{"id":"B05-001","t":"single","c":"B05","q":"施工人员进入施工现场应按规定配备并正确使用的防护用品是：","o":["安全帽、反光服、劳保鞋等","仅需安全帽","由作业人员自行决定","仅在危险区域使用"],"a":0,"e":"手册规定：施工人员进入施工现场是否按规定着装、配备并正确使用防护用品（安全帽、反光服、劳保鞋等）。","s":"第一部分（二）5.施工人员（1）"},{"id":"B05-002","t":"single","c":"B05","q":"脚手架高处作业人员应穿着：","o":["缩口衣裤、防滑鞋","普通便装","雨靴","拖鞋"],"a":0,"e":"手册规定：脚手架高处作业人员是否穿缩口衣裤、防滑鞋。","s":"第一部分（二）5.施工人员（2）"},{"id":"B05-003","t":"single","c":"B05","q":"电焊、切割打磨作业人员应正确佩戴的防护用品不包括：","o":["安全带","防护面罩","绝缘鞋、脚盖","电焊手套、口罩、电焊用工作服"],"a":0,"e":"手册规定：电焊、切割打磨作业人员是否正确佩戴防护面罩、绝缘鞋、脚盖、电焊手套、口罩、电焊用工作服。","s":"第一部分（二）5.施工人员（3）"},{"id":"B05-004","t":"single","c":"B05","q":"高处作业人员应配备并正确使用的防护用品是：","o":["安全带、安全绳","安全帽即可","防滑手套","反光背心"],"a":0,"e":"手册规定：高处作业人员是否配备并正确使用防护用品（安全带、安全绳）。","s":"第一部分（二）5.施工人员（2）"},{"id":"B05-005","t":"judge","c":"B05","q":"现场检查中，施工人员是否存在“三违”现象属于施工人员检查要点之一。","o":["正确","错误"],"a":0,"e":"手册将“施工人员是否存在‘三违’现象”列为施工人员检查要点。","s":"第一部分（二）5.施工人员（6）"},{"id":"B06-001","t":"single","c":"B06","q":"施工现场的洞、井、坑、沟、口以及爆破物、有害气体和液体存放处等危险部位，应：","o":["设置安全防护设施和明显的安全警示标志，防护设施与工程进度同步施工","仅设置警示标志即可","施工完成后统一设置防护","由作业人员自行注意"],"a":0,"e":"手册规定：危险部位是否设置安全防护设施和明显的安全警示标志，安全防护设施是否与工程进度同步施工。","s":"第一部分（二）6.安全防护（1）"},{"id":"B06-002","t":"single","c":"B06","q":"围栏、栏杆、盖板、防护罩、安全网等防护设施应：","o":["材质、规格符合要求，并逐步形成定型化、工具化","只要能起到遮挡作用即可","由作业班组自制","无需统一标准"],"a":0,"e":"手册规定：围栏、栏杆、盖板、防护罩、安全网等防护设施材质、规格是否符合要求，防护设施是否形成定型化、工具化。","s":"第一部分（二）6.安全防护（2）"},{"id":"B06-003","t":"judge","c":"B06","q":"有特殊安全防护要求的作业场所（如喷砂防腐、高压带电体附近等），应按照相关规范设置安全防护设施。","o":["正确","错误"],"a":0,"e":"手册规定：有特殊安全防护要求的作业场所（喷砂防腐、高压带电体附近等），是否按照相关规范设置安全防护设施。","s":"第一部分（二）6.安全防护（3）"},{"id":"B07-001","t":"single","c":"B07","q":"固定式直梯攀登高度超过多少时应加设护笼？","o":["3m","2m","5m","8m"],"a":0,"e":"手册规定：固定式直梯，攀登高度超过3m时，是否加设护笼；攀登高度超过8m时，是否设置梯间平台。","s":"第一部分（二）7.临时通道（6）"},{"id":"B07-002","t":"single","c":"B07","q":"固定式直梯攀登高度超过8m时应设置：","o":["梯间平台","护笼","休息椅","双扶手"],"a":0,"e":"手册规定：攀登高度超过8m时，是否设置梯间平台。","s":"第一部分（二）7.临时通道（6）"},{"id":"B07-003","t":"single","c":"B07","q":"采用斜道时，应加设防滑条，其间距应不大于：","o":["400mm","300mm","500mm","600mm"],"a":0,"e":"手册规定：采用斜道时，是否加设间距不大于400mm的防滑条等防滑措施。","s":"第一部分（二）7.临时通道（6）"},{"id":"B07-004","t":"single","c":"B07","q":"排架、井架、施工用电梯、隧洞等出入口和上部有施工作业、存在高处坠物风险的通道，应设置：","o":["符合要求的防护棚","警示带","围栏","安全网"],"a":0,"e":"手册规定：排架、井架、施工用电梯、大坝廊道、隧洞等出入口和上部有施工作业的通道或存在高处坠物风险的安全通道，是否设有符合要求的防护棚。","s":"第一部分（二）7.临时通道（3）"},{"id":"B08-001","t":"single","c":"B08","q":"移动式操作平台的施工荷载要求是：","o":["不大于1.5kN/m²","不大于2.0kN/m²","不大于3.0kN/m²","无明确限制"],"a":0,"e":"手册规定：移动式操作平台高宽比是否大于2:1，施工荷载是否大于1.5kN/m²，轮子与平台架体连接是否牢固，行走轮和导向轮是否配有制动器或刹车闸等固定措施。","s":"第一部分（二）8.高处作业（4）"},{"id":"B08-002","t":"single","c":"B08","q":"操作平台登高扶梯的踏步间距应不大于：","o":["400mm","300mm","500mm","600mm"],"a":0,"e":"手册规定：操作平台台面铺板、防护栏杆、登高扶梯（踏步间距不大于400mm）是否符合要求。","s":"第一部分（二）8.高处作业（4）"},{"id":"B08-003","t":"single","c":"B08","q":"多少米以上及特殊高处作业，应专门设置与地面联系的通讯设施并配置专人负责通讯联系？","o":["30米以上","20米以上","15米以上","50米以上"],"a":0,"e":"手册规定：30米以上及特殊高处作业，是否专门设置与地面联系的通讯设施，是否配置专人负责通讯联系。","s":"第一部分（二）8.高处作业（11）"},{"id":"B08-004","t":"judge","c":"B08","q":"安全网可以使用密目式安全立网代替平网使用。","o":["正确","错误"],"a":1,"e":"手册检查要点明确：是否存在使用密目式安全立网代替平网使用现象（不允许）。","s":"第一部分（二）8.高处作业（9）"},{"id":"B08-005","t":"single","c":"B08","q":"高处作业人员水平移动或高处临边作业不能够装设安全防护栏杆时，应：","o":["设置水平安全绳","仅佩戴安全带即可","停止作业","设置警示标志即可"],"a":0,"e":"手册规定：高处作业人员水平移动或高处临边作业不能够装设安全防护栏杆时，是否设置水平安全绳，固定支撑点是否符合要求。","s":"第一部分（二）8.高处作业（10）"},{"id":"B08-006","t":"single","c":"B08","q":"雨天和雪天进行高处作业时，应采取的措施是：","o":["防滑、防寒和防冻措施","仅防滑措施","停止一切高处作业","缩短作业时间即可"],"a":0,"e":"手册规定：雨天和雪天进行高处作业时，有无防滑、防寒和防冻措施。","s":"第一部分（二）8.高处作业（8）"},{"id":"B08-007","t":"judge","c":"B08","q":"高处焊接、切割作业时，应事先清除火星飞溅范围内的易燃易爆物品或采取隔离措施，并按规定办理动火审批手续、配备消防器材。","o":["正确","错误"],"a":0,"e":"手册规定：进行高处焊接、切割作业时，是否事先清除火星飞溅范围内的易燃易爆物品或采取必要的隔离措施，是否按规定办理动火审批手续，是否配备消防器材。","s":"第一部分（二）8.高处作业（12）"},{"id":"B09-001","t":"single","c":"B09","q":"交叉作业的安全管理要求是：","o":["设置警戒区并由专人监护，安排专职安全管理人员进行安全检查与协调","各作业队伍自行负责，无需协调","仅需设置警示标志","由监理工程师统一指挥"],"a":0,"e":"手册规定：交叉作业是否设置警戒区并由专人监护，交叉作业区域是否安排专职安全管理人员进行安全检查与协调。","s":"第一部分（二）9.交叉作业（1）（2）"},{"id":"B09-002","t":"single","c":"B09","q":"两个及以上单位在同一作业区域内交叉作业，应当：","o":["签订安全生产管理协议，明确各自的安全管理职责","口头约定各自范围即可","由总包单位统一负责，无需签订协议","各自施工互不干涉"],"a":0,"e":"手册规定：两个及以上单位在同一作业区域内交叉作业，是否签订了安全生产管理协议，明确各自的安全管理职责，是否采取相应的安全措施。","s":"第一部分（二）9.交叉作业（6）"},{"id":"B09-003","t":"judge","c":"B09","q":"交叉作业时，允许不使用工具袋或吊笼而直接抛掷工具材料。","o":["正确","错误"],"a":1,"e":"手册检查要点：交叉作业时，是否存在未使用工具袋或吊笼等吊运工具材料的现象（属于禁止行为）。","s":"第一部分（二）9.交叉作业（5）"},{"id":"B10-001","t":"single","c":"B10","q":"受限空间作业前应：","o":["按规定办理作业许可，并核对现场设备设施和环境与许可相符","由班组长口头同意即可","直接作业无需许可","事后补办许可"],"a":0,"e":"手册规定：是否按规定办理作业许可，现场的设备、设施和现场环境是否与许可相符。","s":"第一部分（二）10.受限空间作业（1）"},{"id":"B10-002","t":"single","c":"B10","q":"受限空间作业存在可燃性气体时，电气设备设施及照明应：","o":["采取整体电气防爆和防静电措施","使用普通照明即可","使用安全电压即可，无需防爆","关闭所有电气设备即可"],"a":0,"e":"手册规定：是否使用安全电压和安全行灯；存在可燃性气体的作业场所，所有的电气设备设施及照明是否采取整体电气防爆和防静电措施。","s":"第一部分（二）10.受限空间作业（3）"},{"id":"B10-003","t":"judge","c":"B10","q":"受限空间作业期间，监护人员必须在岗，并配备相应的检测和报警仪器、安全设备设施和个体防护用品。","o":["正确","错误"],"a":0,"e":"手册规定：作业期间，监护人员是否在岗，是否设置适时与作业人员进行有效的安全、报警、撤离等信息交流设施，是否配备相应的检测和报警仪器，安全设备设施和个体防护用品，应急设备、物资和药品。","s":"第一部分（二）10.受限空间作业（5）"},{"id":"B10-004","t":"single","c":"B10","q":"对易燃易爆、有毒有害等受限空间，作业前应进行的工艺处理是：","o":["吹扫、蒸煮、置换合格，相连管线阀门加盲板隔离","仅通风即可","仅检测即可","直接作业"],"a":0,"e":"手册规定：如易燃易爆、有毒有害等受限空间，应切实做好工艺处理，将受限空间吹扫、蒸煮、置换合格，所有与其相连且可能存在易燃易爆、有毒有害物料的管线、阀门应加盲板隔离。","s":"第一部分（二）10.受限空间作业（2）"},{"id":"B11-001","t":"single","c":"B11","q":"剧毒化学品以及储存数量构成重大危险源的其他危险化学品，应实行：","o":["双人收发、双人保管制度","单人专管制度","三人共管制度","由仓库主管自行决定"],"a":0,"e":"手册规定：剧毒化学品以及储存数量构成重大危险源的其他危险化学品，是否在专用仓库内单独存放，是否实行双人收发、双人保管制度，是否建立出入库核查、登记制度。","s":"第一部分（二）11.危险物品管理（1）③"},{"id":"B11-002","t":"single","c":"B11","q":"剧毒化学品及构成重大危险源的其他危险化学品，应将其储存数量、储存地点以及管理人员情况报哪里备案？","o":["所在地县级安监部门和公安机关","仅报上级单位","仅报建设单位","无需备案"],"a":0,"e":"手册规定：是否将其储存数量、储存地点以及管理人员的情况，报所在地县级安监部门（在港区内储存的，报港口部门）和公安机关备案。","s":"第一部分（二）11.危险物品管理（1）③"},{"id":"B11-003","t":"judge","c":"B11","q":"放射性同位素可以与易燃、易爆、腐蚀性物品同库存放，只要指定专人负责保管即可。","o":["正确","错误"],"a":1,"e":"手册规定：放射性同位素是否单独存放，是否存在与易燃、易爆、腐蚀性物品等一起存放，是否指定专人负责保管。","s":"第一部分（二）11.危险物品管理（2）④"},{"id":"B11-004","t":"single","c":"B11","q":"射线检测人员工作时的防护要求是：","o":["身着防护服饰，并佩带辐射报警器和个人剂量仪","仅需身着防护服饰","仅需佩带个人剂量仪","由现场负责人决定"],"a":0,"e":"手册规定：射线检测人员工作时是否身着防护服饰，并佩带辐射报警器和个人剂量仪，以测定个人受照的累积剂量当量；现场射线检测作业实施前是否发布射线探伤通告。","s":"第一部分（二）11.危险物品管理（2）⑥"},{"id":"B11-005","t":"single","c":"B11","q":"易燃易爆及其他危险化学品作业场所应采取的防范措施是：","o":["设置明显安全警示标志，采取必要的安全警戒措施，落实“人防、技防、物防、犬防”措施","仅设置警示标志","仅配备灭火器材","由专人看守即可"],"a":0,"e":"手册规定：作业场所是否设置明显的安全警示标志、是否采取必要的安全警戒措施；是否储存在专用仓库、专用场地或专用储存室内并由专人负责管理，是否有必要的“人防、技防、物防、犬防”措施。","s":"第一部分（二）11.危险物品管理（1）①②"},{"id":"B12-001","t":"judge","c":"B12","q":"起重机吊运重物时可以从人员的头顶上方越过，只要指挥人员确认安全即可。","o":["正确","错误"],"a":1,"e":"手册检查要点：起重机吊运重物时是否从人员的头顶上方越过（严禁）。","s":"第一部分（二）12.施工机械设备（15）"},{"id":"B12-002","t":"single","c":"B12","q":"起吊物绑挂时，吊钩悬挂点应位于：","o":["吊物重心的垂直线上","吊物一端","吊物上方任意位置","吊物底部"],"a":0,"e":"手册规定：起吊物是否绑挂牢固，吊钩悬挂点是否在吊物重心的垂直线上。","s":"第一部分（二）12.施工机械设备（11）"},{"id":"B12-003","t":"single","c":"B12","q":"在被吊物件棱角处应采取的保护措施是：","o":["垫木方或半圆管等防止钢丝绳、吊带损坏，并有防止其坠落的措施","直接起吊即可","用麻布包裹","增加钢丝绳数量"],"a":0,"e":"手册规定：是否在被吊物件棱角处采取垫木方或半圆管等防止钢丝绳、吊带损坏的保护措施，且有防止木方或半圆管坠落的措施。","s":"第一部分（二）12.施工机械设备（13）"},{"id":"B12-004","t":"judge","c":"B12","q":"甲供、外租、分包单位的施工设备应纳入统一管理和检查。","o":["正确","错误"],"a":0,"e":"手册规定：是否将甲供、外租、分包单位的施工设备实施统一管理，对施工设备技术性能及安全状况是否进行检查。","s":"第一部分（二）12.施工机械设备（8）"},{"id":"B12-005","t":"single","c":"B12","q":"起重吊装作业时应：","o":["建立警戒区域、设置警示标识，起重机械支腿设置路基板","仅需指挥人员在场","设置警示标识即可","由作业人员自行注意"],"a":0,"e":"手册规定：起重吊装作业是否建立警戒区域、设置警示标识；起重机械支腿是否设置路基板；工作区域内是否有无关人员逗留或通过。","s":"第一部分（二）12.施工机械设备（10）"},{"id":"B13-001","t":"judge","c":"B13","q":"装载机、自卸车、油罐车、平板车、吊车等车辆不得违规承载人，严禁“人货混装”。","o":["正确","错误"],"a":0,"e":"手册检查要点：是否存在装载机、自卸车、油罐车、平板车、吊车等车辆违规承载人现象，是否存在“人货混装”现象。","s":"第一部分（二）13.交通运输（4）"},{"id":"B13-002","t":"single","c":"B13","q":"手册中“交通运输”主要指：","o":["场内交通运输","社会道路运输","长途客运","水上运输"],"a":0,"e":"手册明确：这里的“交通运输”主要是指“场内交通运输”。","s":"第一部分（二）13.交通运输"},{"id":"B13-003","t":"single","c":"B13","q":"交通运输检查要点不包括：","o":["车辆购置发票与保险单据","无证驾驶、酒后驾驶、超载、超速、超限","道路平整度、宽度、坡度、转弯是否符合规定","大型设备和大型结构件运输是否制定专项安全措施"],"a":0,"e":"手册检查要点包括道路条件、交通标志防护设施、违章驾驶行为、违规载人、机动车辆检查、大型设备运输专项措施等，未列车辆购置发票。","s":"第一部分（二）13.交通运输（1）-（6）"},{"id":"B14-001","t":"single","c":"B14","q":"矿山法隧道施工应严格执行的股份公司规定是：","o":["《隧道施工九条规定实施细则》","《斜井施工安全管理强制规定》","《脚手架安全管理强制规定》","《临时用电安全管理强制规定》"],"a":0,"e":"手册规定：地下工程应严格执行股份公司《隧道施工九条规定实施细则》。","s":"第一部分（二）14.地下工程"},{"id":"B14-002","t":"single","c":"B14","q":"高度风险及隧道在初期支护未封闭成环段，作业人数控制要求是：","o":["各工序作业人员总数不得超过9人，排险和装药工序不得超过2人","总数不得超过15人","总数不得超过20人","无人数限制"],"a":0,"e":"手册检查要点：高度风险及隧道在初期支护未封闭成环段，是否存在各工序作业人员总数超过9人，排险和装药工序超过了2人的现象。","s":"第一部分（二）14.地下工程（1）③"},{"id":"B14-003","t":"judge","c":"B14","q":"隧道施工应实行进出洞登记，登记记录严禁代签。","o":["正确","错误"],"a":0,"e":"手册规定：是否实行进出洞登记，登记记录有否代签现象。","s":"第一部分（二）14.地下工程（1）②"},{"id":"B14-004","t":"single","c":"B14","q":"斜井施工安全管理强制规定中，关于提升系统的要求是：","o":["严禁提升系统和辅助设施未经验收合格投入使用，提升系统运行不得超载和人货混装，操作人员持证上岗，一人操作、一人监护","可由专人操作无需监护","验收前可试运行","允许人货混装但需限速"],"a":0,"e":"手册“九个严禁、九个必须”明确：严禁提升系统和辅助设施未经验收合格投入使用，提升系统运行不得超载和人货混装；操作人员必须持证上岗，一人操作、一人监护。","s":"第一部分（二）14.地下工程（3）②"},{"id":"B14-005","t":"single","c":"B14","q":"斜井施工“九个严禁，九个必须”中，关于人员进出管理的要求是：","o":["严禁未经许可的人员进入作业区域，井口必须设置门禁系统，严格执行下井“挂牌”登记制度","仅需登记姓名","由工区自行管理","设置警示标志即可"],"a":0,"e":"手册规定：严禁未经许可的人员进入作业区域；井口必须设置门禁系统，严格执行下井“挂牌”登记制度。","s":"第一部分（二）14.地下工程（3）⑤"},{"id":"B14-006","t":"judge","c":"B14","q":"隧道施工中，应对有毒有害气体进行监测监控，通风排烟系统应正常运行，洞内不得使用汽油机械。","o":["正确","错误"],"a":0,"e":"手册规定：是否对有毒有害气体进行监测监控，通风排烟系统是否正常运行，是否存在浓度超标施工作业的情况，洞内是否存在使用汽油机械现象，使用柴油机械是否设置废气净化装置。","s":"第一部分（二）14.地下工程（1）③"},{"id":"B15-001","t":"single","c":"B15","q":"建筑施工现场临时用电工程专用的电源中性点直接接地的220/380V三相四线制低压电力系统，必须符合的三项规定是：","o":["三级配电、TN-S接零保护、二级漏电保护","两级配电、TN-C接零保护、一级漏电保护","三级配电、TN-C接零保护、二级漏电保护","四级配电、TN-S接零保护、三级漏电保护"],"a":0,"e":"手册规定：采用三级配电系统；采用TN-S接零保护系统；采用二级漏电保护系统。","s":"第一部分（二）15.施工用电 基本要求"},{"id":"B15-002","t":"single","c":"B15","q":"施工现场临时用电设备在多少台及以上或设备总容量在多少kW及以上时，应编制施工用电组织设计？","o":["5台及以上，或总容量50kW及以上","3台及以上，或30kW及以上","10台及以上，或100kW及以上","8台及以上，或80kW及以上"],"a":0,"e":"手册规定：施工现场临时用电设备在5台及以上或设备总容量在50kW及以上者，应编制施工用电组织设计。","s":"第一部分（二）15.施工用电 注"},{"id":"B15-003","t":"single","c":"B15","q":"开关箱与固定用电设备的距离应不大于：","o":["3米","5米","8米","10米"],"a":0,"e":"手册引用临时用电安全管理强制规定：必须执行“一机一闸一箱一漏”，开关箱与固定用电设备的距离不大于3米。","s":"第一部分（二）15.施工用电 补充知识（7）"},{"id":"B15-004","t":"single","c":"B15","q":"隧道、人防工程、高温、有导电灰尘、比较潮湿或灯具离地面高度低于2.5m等场所的照明电源电压不应大于：","o":["36V","24V","12V","220V"],"a":0,"e":"手册规定：上述场所照明电源电压不应大于36V；潮湿和易触及带电体场所不应大于24V；特别潮湿场所、导电良好的地面、锅炉或金属容器内不应大于12V。","s":"第一部分（二）15.施工用电（5）②"},{"id":"B15-005","t":"single","c":"B15","q":"特别潮湿场所、导电良好的地面、锅炉或金属容器内的照明电源电压不应大于：","o":["12V","24V","36V","48V"],"a":0,"e":"手册规定：特别潮湿场所、导电良好的地面、锅炉或金属容器内的照明电压不应大于12V。","s":"第一部分（二）15.施工用电（5）②"},{"id":"B15-006","t":"judge","c":"B15","q":"临时用电严禁使用护套线、散开式碘钨灯、民用插板、倒顺开关。","o":["正确","错误"],"a":0,"e":"手册引用《临时用电安全管理强制规定》：严禁使用护套线、散开式碘钨灯、民用插板、倒顺开关。","s":"第一部分（二）15.施工用电 补充知识（4）"},{"id":"B15-007","t":"single","c":"B15","q":"架空线路的敷设要求是：","o":["采用绝缘导线并架设在专用电线杆上，严禁架设在树木、脚手架及其他设施上","可采用裸导线","可架设在脚手架上","可沿地面明设"],"a":0,"e":"手册规定：架空线是否采用绝缘导线（严禁使用花线、护套线），是否架设在专用电线杆上（严禁架设在树木、脚手架及其他设施上）；电缆线路严禁沿地面明设。","s":"第一部分（二）15.施工用电（2）②"},{"id":"B15-008","t":"single","c":"B15","q":"室内明敷主干线距离地面高度不应小于：","o":["2.5米","2.0米","1.8米","3.0米"],"a":0,"e":"手册检查要点：室内明敷主干线距离地面高度是否小于2.5米（即不应小于2.5米），是否存在乱拉乱接或架空缆线上吊挂物品现象。","s":"第一部分（二）15.施工用电（2）⑥"},{"id":"B15-009","t":"judge","c":"B15","q":"非电工作业人员不得安装、巡检、维修或拆除临时用电设备和线路，电工作业必须有人监护。","o":["正确","错误"],"a":0,"e":"手册引用强制规定：严禁非电工作业人员安装、巡检、维修或拆除临时用电设备和线路，电工必须持证上岗，作业必须有人监护。","s":"第一部分（二）15.施工用电 补充知识（8）"},{"id":"B16-001","t":"single","c":"B16","q":"脚手架验收合格后应在醒目位置悬挂验收合格牌，牌上应注明：","o":["验收时间、负责人、现场技术员、现场安全员、监理单位验收责任人、核定承载重量、核定上架人数","仅验收时间","仅验收负责人","仅核定承载重量"],"a":0,"e":"手册规定：脚手架是否在醒目位置悬挂“验收合格牌”（应注明：验收时间、负责人、现场技术员、现场安全员、监理单位验收责任人、核定承载重量、核定上架人数等信息）。","s":"第一部分（二）16.脚手架（7）"},{"id":"B16-002","t":"single","c":"B16","q":"脚手架作业层外侧挡脚板高度应不小于：","o":["180mm","120mm","200mm","250mm"],"a":0,"e":"手册规定：作业层外侧是否设置高度不小于180mm的挡脚板。","s":"第一部分（二）16.脚手架（9）"},{"id":"B16-003","t":"single","c":"B16","q":"脚手架作业层脚手板下应用安全平网兜底，或作业层以下每隔多少米采用安全平网封闭？","o":["10m","6m","8m","12m"],"a":0,"e":"手册规定：作业层脚手板下是否用安全平网兜底或作业层以下每隔10m采用安全平网封闭。","s":"第一部分（二）16.脚手架（9）"},{"id":"B16-004","t":"judge","c":"B16","q":"在暴雨、台风、暴风雪等极端天气前后，应组织有关人员对脚手架进行检查或重新验收。","o":["正确","错误"],"a":0,"e":"手册规定：在暴雨、台风、暴风雪等极端天气前后，是否组织有关人员对脚手架进行检查或重新验收。","s":"第一部分（二）16.脚手架（6）"},{"id":"B16-005","t":"single","c":"B16","q":"脚手架、跨越架搭设和拆除作业人员应：","o":["持有有效证件","经班组长同意即可","由项目部指定","经简单培训即可"],"a":0,"e":"手册规定：现场正在进行脚手架、跨越架搭设和拆除作业，作业人员是否持有有效证件。","s":"第一部分（二）16.脚手架（2）"},{"id":"B17-001","t":"single","c":"B17","q":"仓库内消防器材分组布置要求是：","o":["每组不少于4个，每组间距小于30m","每组不少于2个，间距小于50m","每组不少于6个，间距小于20m","无明确规定"],"a":0,"e":"手册规定：仓库内消防器材是否分组布置、每组数量（不少于4个）、每组间距（小于30m）是否满足要求。","s":"第一部分（二）17.消防设施（4）"},{"id":"B17-002","t":"judge","c":"B17","q":"现场动火作业应履行办理动火审批手续，指定监护人员，并对作业人员进行技术交底。","o":["正确","错误"],"a":0,"e":"手册规定：现场动火作业是否履行办理了动火审批手续，动火作业是否指定监护人员，是否对从事有火灾危险的作业人员在作业前进行技术交底。","s":"第一部分（二）17.消防设施（10）"},{"id":"B17-003","t":"single","c":"B17","q":"重点消防区域不包括：","o":["普通钢筋加工棚","办公用房、宿舍","发电机房、变配电房","可燃材料库房、厨房操作间、锅炉房"],"a":0,"e":"手册列举重点消防区域：办公用房、宿舍，发电机房、变配电房、可燃材料库房、厨房操作间、锅炉房、可燃材料堆场及其加工厂、固定动火作业场、易燃易爆危险品库房。","s":"第一部分（二）17.消防设施（1）"},{"id":"B18-001","t":"single","c":"B18","q":"职业病防护设施的管理要求是：","o":["经常性的维护、检修，定期检测其性能和效果，确保处于正常状态","安装后无需维护","每年检查一次即可","由作业人员自行维护"],"a":0,"e":"手册规定：职业病防护设施是否进行经常性的维护、检修，定期检测其性能和效果，确保其处于正常状态。","s":"第一部分（二）18.职业健康防护设施（3）"},{"id":"B18-002","t":"judge","c":"B18","q":"应优先采用有利于防治职业病和保护劳动者健康的新技术、新工艺、新设备、新材料，逐步替代职业病危害严重的技术、工艺、设备、材料。","o":["正确","错误"],"a":0,"e":"手册规定：是否优先采用有利于防治职业病和保护劳动者健康的新技术、新工艺、新设备、新材料，逐步替代职业病危害严重的技术、工艺、设备、材料。","s":"第一部分（二）18.职业健康防护设施（2）"},{"id":"B19-001","t":"single","c":"B19","q":"营地选址应做到“三避一高”，即：","o":["避开洪水、避开滑坡体、避开泥石流，高出安全水位线","避开居民区、避开农田、避开道路，高出地面","避开高压线、避开河道、避开山体，高出路面","避开风区、避开雷区、避开震区，高出周边"],"a":0,"e":"手册规定：营地（含工作场所）选址是否做到“三避一高”（即避开洪水、避开滑坡体、避开泥石流，高出安全水位线）。","s":"第一部分（二）19.营地安全（1）"},{"id":"B19-002","t":"single","c":"B19","q":"营地建筑材料的燃烧性能等级应为：","o":["A级，不得使用聚苯乙烯、聚氨酯泡沫板","B1级即可","B2级即可","无等级要求"],"a":0,"e":"手册规定：营地建筑材料燃烧性能等级是否为A级（不得使用聚苯乙烯、聚氨酯泡沫板）。","s":"第一部分（二）19.营地安全（5）"},{"id":"B19-003","t":"single","c":"B19","q":"营地用电管理要求是：","o":["电源线布置穿墙须有套管，室内严禁私拉乱接，严禁使用大功率及不合格电器产品","只需安装漏电保护器","由居住人员自行管理","允许使用大功率电器"],"a":0,"e":"手册规定：用电是否满足要求（电源线布置穿墙须有套管，室内严禁私拉、乱接，严禁使用大功率及不合格电器产品）。","s":"第一部分（二）19.营地安全（6）"},{"id":"B19-004","t":"single","c":"B19","q":"营地应建立居住人员管理台账，台账信息包括：","o":["姓名、性别、年龄、家庭住址、本人及家庭联系电话","仅姓名与房间号","仅人数统计","仅身份证号"],"a":0,"e":"手册规定：是否建立了营地居住人员管理台账（姓名、性别、年龄、家庭住址、本人及家庭联系电话等信息），是否明确了各房间的责任人。","s":"第一部分（二）19.营地安全（7）"},{"id":"B19-005","t":"judge","c":"B19","q":"营地严禁出现“三合一”现象（住宿、生产、仓储混合设置）。","o":["正确","错误"],"a":0,"e":"手册检查要点：营地是否存在“三合一”现象。","s":"第一部分（二）19.营地安全（6）"},{"id":"B04-005","t":"judge","c":"B04","q":"尘、毒、噪作业场所应开展日常监测工作，监测工具应有效。","o":["正确","错误"],"a":0,"e":"手册检查要点：尘、毒、噪作业场所是否开展日常监测工作，监测工具是否有效。","s":"第一部分（二）4.尘、毒、噪作业（1）"},{"id":"B06-004","t":"single","c":"B06","q":"施工现场常见的安全防护设施不包括：","o":["消防水池","围栏、栏杆","盖板、防护罩","安全网"],"a":0,"e":"手册列举的防护设施为围栏、栏杆、盖板、防护罩、安全网等。","s":"第一部分（二）6.安全防护（2）"},{"id":"B09-004","t":"single","c":"B09","q":"交叉作业防护措施要求是：","o":["搭设严密、牢固的防护隔离设施，下方设置警戒隔离区","仅设置警示标志","仅安排人员监护","由上方作业单位负责即可"],"a":0,"e":"手册规定：交叉作业是否搭设严密、牢固的防护隔离设施，下方是否设置警戒隔离区。","s":"第一部分（二）9.交叉作业（4）"},{"id":"B13-004","t":"judge","c":"B13","q":"应对场内机动车辆（特别是上下班交通车辆）进行季、月和日常检查，禁止报废车辆在场区内使用。","o":["正确","错误"],"a":0,"e":"手册规定：是否对场内机动车辆（特别是上下班交通车辆）进行季、月季和日常检查，是否存在报废车辆在场区内使用现象。","s":"第一部分（二）13.交通运输（5）"},{"id":"B13-005","t":"judge","c":"B13","q":"大型设备和大型结构件的运输及搬运应制定专项安全措施并严格执行。","o":["正确","错误"],"a":0,"e":"手册规定：大型设备和大型结构件的运输及搬运是否制定专项安全措施，是否严格执行。","s":"第一部分（二）13.交通运输（6）"},{"id":"B17-004","t":"judge","c":"B17","q":"现场应绘制消防设施平面布置图，并明确重点消防区域、设置消防通道和疏散区。","o":["正确","错误"],"a":0,"e":"手册规定：是否明确了重点消防区域、是否设置了消防通道、消防疏散区并作好警示提示标识；是否绘制有现场消防设施平面布置图。","s":"第一部分（二）17.消防设施（1）（9）"},{"id":"B18-003","t":"judge","c":"B18","q":"职业病防护设施应配置到位并有效，确保处于正常状态。","o":["正确","错误"],"a":0,"e":"手册规定：职业病防护设施是否配置到位、是否有效。","s":"第一部分（二）18.职业健康防护设施（1）"},{"id":"C01-001","t":"single","c":"C01","q":"安全检查考核人员在检查前应做的准备工作不包括：","o":["编制受检单位的整改预算","熟悉股份公司安全生产与职业健康、能源节约与生态环境保护管理的制度、要点、通报、专项活动、工作手册等文件","了解受检单位的作业类型，准确把握安全生产风险、职业健康、环境、能耗设备等因素","了解受检单位所在地的地方规定"],"a":0,"e":"手册规定检查前准备三项：熟悉股份公司相关制度要点等文件；了解受检单位作业类型；了解受检单位所在地的地方规定。","s":"第一部分 二、安全检查考核人员工作基本要求（一）检查前准备"},{"id":"C01-002","t":"single","c":"C01","q":"每个检查考核单位，每个检查考核组成员所负责内容至少应提出几个主要问题及整改要求？","o":["3～5个","1～2个","6～8个","10个以上"],"a":0,"e":"手册规定：原则上每个检查考核单位，每个检查考核组成员所负责内容至少提出3～5个主要问题及整改要求，并将记录的问题用红色标记出来，注明扣分原因及整改建议。","s":"第一部分 二、（二）对检查考核组成员要求 2"},{"id":"C01-003","t":"single","c":"C01","q":"相关规程、规范及制度无规定的内容，检查人员应如何处理？","o":["不得按自己的理解发表意见，应征求专家组讨论统一意见后进行说明","按个人经验判断即可","参照其他单位做法","不作记录"],"a":0,"e":"手册规定：相关规程、规范及制度无规定的内容，不得按自己的理解发表意见，应征求专家组讨论统一意见后进行说明。","s":"第一部分 二、（二）对检查考核组成员要求 3"},{"id":"C01-004","t":"judge","c":"C01","q":"检查考核通报会上，检查人员应对受检单位的工作作出总体评价。","o":["正确","错误"],"a":1,"e":"手册规定：在检查考核通报会上发言应简洁直接，重点说明发现问题及整改建议，不对检查单位的工作做总体评价。","s":"第一部分 二、（二）对检查考核组成员要求 4"},{"id":"C01-005","t":"single","c":"C01","q":"检查人员现场应随机抽查几名作业人员，询问其培训、持证情况？","o":["2～3名","1名","5～8名","10名"],"a":0,"e":"手册规定：现场随机抽查2～3名作业人员，询问其培训、持证情况，并在内业检查中对相关情况进行验证。","s":"第一部分 二、（三）查施工现场 2"},{"id":"C01-006","t":"single","c":"C01","q":"查施工现场的必查项包括：","o":["重大风险的场所、部位和环节，重要设备、设施，营地等","仅作业面","仅办公区","仅资料档案"],"a":0,"e":"手册规定：根据项目特点和施工实际，对易发生伤亡事故的主要环节、部位和工艺等进行检查，重大风险的场所、部位和环节，重要设备、设施，营地等为必查项。","s":"第一部分 二、（三）查施工现场 4"},{"id":"C01-007","t":"single","c":"C01","q":"在规章制度、操作规程及其它内业内容检查中，应有针对性地抽查几个相应资料？","o":["3～5个","1～2个","6～10个","无需抽查"],"a":0,"e":"手册规定：在规章制度、操作规程及其它内业内容检查中，应有针对性地抽查3～5个相应资料，详实记录制度本身及相关资料存在的问题。","s":"第一部分 二、（四）查内业管理 3"},{"id":"C01-008","t":"single","c":"C01","q":"首末次会议上，“四个责任体系”负责人和党组织书记应：","o":["根据安全职责及履职清单进行履职脱稿汇报","提交书面报告即可","由安全总监代为汇报","无需汇报"],"a":0,"e":"手册规定：“四个责任体系”负责人和党组织书记，应根据安全职责及履职清单，进行履职脱稿汇报，专家组应对其安全意识及履职情况进行点评。","s":"第一部分 二、（五）首末次会议 2"},{"id":"C01-009","t":"single","c":"C01","q":"首末次会议上可随机抽查几名部门负责人介绍其安全职责及履职情况？","o":["1～2名","3～5名","5～8名","不进行抽查"],"a":0,"e":"手册规定：会上可随机抽查1～2名部门负责人介绍其安全职责及履职情况，并进行现场点评。","s":"第一部分 二、（五）首末次会议 3"},{"id":"C01-010","t":"judge","c":"C01","q":"受邀参加股份公司组织的评审会、研讨会的专家，可以凭个人观点代替标准规范在现场临场发挥。","o":["正确","错误"],"a":1,"e":"手册规定：专家必须提前阅读相关资料，对于无把握、不熟悉的内容须认真查阅相关法规、规范，不能以个人观点代替标准规范；严禁不提前下功夫而在现场“临场发挥”。","s":"第一部分 二、（六）评审、研讨会议"},{"id":"C01-011","t":"judge","c":"C01","q":"现场检查发现的问题应进行拍照，统一汇总留存备查。","o":["正确","错误"],"a":0,"e":"手册规定：对照考核要点重点查看与自己负责检查内容相关的作业部位、设备设施、关键岗位等，对发现问题进行拍照，统一汇总留存备查。","s":"第一部分 二、（三）查施工现场 1"},{"id":"C01-012","t":"judge","c":"C01","q":"内业检查记录要详实，对照《检查考核工作手册》重点记录检查内容、提供资料名称及存在问题，扣分项须注明扣分原因。","o":["正确","错误"],"a":0,"e":"手册规定：内业检查记录要详实，对照《检查考核工作手册》重点记录检查内容、提供资料名称及存在问题，考核检查组统一汇总检查记录、整改问题，扣分项须注明扣分原因。","s":"第一部分 二、（四）查内业管理 1"},{"id":"C02-001","t":"single","c":"C02","q":"施工单位安全考核汇总表中，管理部分得分C的计算方式是：","o":["（项目部得分A×70% + 总部管理部分得分B×30%）×60%","A×50% + B×50%","（A×30% + B×70%）×60%","A×70% + B×30%"],"a":0,"e":"手册考核汇总表：管理部分得分C =（A*70% + B*30%）*60%，综合得分E = C + D，标准分为100分。","s":"第一部分 三、附件 施工单位安全考核汇总表"},{"id":"C02-002","t":"single","c":"C02","q":"施工单位事故控制考核中，承担主要责任较大及以上事故扣分为：","o":["40分","30分","20分","10分"],"a":0,"e":"手册事故控制考核表：承担主要责任较大及以上事故扣40分。","s":"第一部分 三、附件 施工单位事故控制考核表"},{"id":"C02-003","t":"single","c":"C02","q":"承担主要责任一般事故，年营业收入低于50亿元的，每死亡1人扣分及递减规则是：","o":["死亡1人扣10分；年营业收入每递增50亿，每死亡1人扣分递减2分，最低不低于4分","死亡1人扣5分","死亡1人扣20分","统一扣10分，不递减"],"a":0,"e":"手册规定：承担主要责任一般事故，年营业收入低于50亿，死亡1人扣10分；年营业收入每递增50亿，每死亡1人扣分递减2分，最低扣分不低于4分。","s":"第一部分 三、附件 施工单位事故控制考核表"},{"id":"C02-004","t":"single","c":"C02","q":"事故控制考核中，一般事故每死亡1人扣分为：","o":["3分","10分","5分","1分"],"a":0,"e":"手册规定：一般事故每死亡1人扣3分；较大事故每起扣10～20分；重大及以上事故每起扣30～40分。","s":"第一部分 三、附件 施工单位事故控制考核表"},{"id":"C02-005","t":"single","c":"C02","q":"发生迟报、漏报、谎报、瞒报事故的扣分原则是：","o":["每次扣10～40分","每次扣5分","每次扣50分","不扣分"],"a":0,"e":"手册事故控制考核表中“事故报告”项：迟报、漏报、谎报、瞒报事故，每次扣10～40分。","s":"第一部分 三、附件 施工单位事故控制考核表 事故报告"},{"id":"C02-006","t":"single","c":"C02","q":"施工单位总部安全管理考核表中，未按规定配备安全总监的扣分为：","o":["5分","3分","2分","1分"],"a":0,"e":"手册规定：未按规定配备安全总监，扣5分；未按规定设置安全部门，扣5分；配备专职管理人员少一人，扣1分。","s":"第一部分 三、附件 施工单位总部安全管理考核表"},{"id":"C02-007","t":"single","c":"C02","q":"施工单位总部安全管理考核表中，未建立全员岗位安全履职清单的扣分为：","o":["3分","5分","1分","2分"],"a":0,"e":"手册规定：未建立全员岗位安全履职清单，扣3分；四个责任体系各级责任人未明确，扣3分；党组织书记职责不明确，扣3分。","s":"第一部分 三、附件 施工单位总部安全管理考核表"},{"id":"C02-008","t":"single","c":"C02","q":"施工单位总部安全管理考核表中，未完成上级部署的重点工作的扣分原则是：","o":["每项扣3分","每项扣1分","每项扣5分","不扣分"],"a":0,"e":"手册规定：未完成上级部署的重点工作，每项扣3分；未及时传达、落实，每项扣2分；未按时完成工作，每项扣1分。","s":"第一部分 三、附件 施工单位总部安全管理考核表"},{"id":"C02-009","t":"single","c":"C02","q":"施工单位安全考核汇总表中，综合得分E的构成是：","o":["E = 管理部分得分C + 事故控制部分得分D","E = C - D","E = C×70% + D×30%","E = C×60% + D×40%"],"a":0,"e":"手册规定：综合得分E = C + D（标准分为100分），其中管理部分得分C =（A*70% + B*30%）*60%。","s":"第一部分 三、附件 施工单位安全考核汇总表"},{"id":"C02-010","t":"single","c":"C02","q":"发生群体性职业健康危害事件的扣分原则是：","o":["每发生一起扣10～40分","每发生一起扣5分","每发生一起扣50分","不扣分"],"a":0,"e":"手册事故控制考核表：发生群体性职业健康危害事件，每发生一起扣10～40分。","s":"第一部分 三、附件 施工单位事故控制考核表"},{"id":"D01-001","t":"single","c":"D01","q":"第二部分要求，各级党组织应组织专题学习并贯彻落实的是：","o":["习近平总书记关于能源节约与生态环境保护重要论述","习近平法治思想","习近平总书记关于安全生产重要论述","习近平总书记关于科技创新重要论述"],"a":0,"e":"手册规定：各级党组织应组织专题学习并贯彻落实习近平总书记关于能源节约与生态环境保护重要论述。","s":"第二部分 一、贯彻落实上级要求（一）1"},{"id":"D01-002","t":"single","c":"D01","q":"关于上级文件的批示要求，下列说法正确的是：","o":["主要领导对重要文件批示，主管领导对上级印发的所有文件批示","仅需主管领导批示","仅需主管部门批示","由办公室统一处理即可"],"a":0,"e":"手册规定：主要领导对上级印发的重要文件（涉及全年性工作、重要的专项工作、需要主要领导亲自部署的工作等）进行批示并提出具体的工作要求；主管领导对上级印发的所有文件进行批示，提出具体的工作要求或意见。","s":"第二部分 一、贯彻落实上级要求（一）2、3"},{"id":"D01-003","t":"judge","c":"D01","q":"第二部分同样明确：贯彻落实上级要求严禁以会议传达会议、以文件传达文件。","o":["正确","错误"],"a":0,"e":"手册专家检查考核要求：检查贯彻落实上级要求的方式，严禁以会议传达会议、以文件传达文件。","s":"第二部分 一、贯彻落实上级要求（三）2"},{"id":"D02-001","t":"single","c":"D02","q":"能源节约与生态环境保护工作领导小组成立文件应：","o":["经本单位第一责任人签发，以正式文件下发，成员动态管理及时调整","经分管领导签发即可","由办公室自行发文","无需正式文件"],"a":0,"e":"手册规定：领导小组成立文件经本单位第一责任人签发，以正式文件下发，领导小组成员做到动态管理，及时调整。","s":"第二部分 二、组织机构、人员及职责（一）1（1）"},{"id":"D02-002","t":"single","c":"D02","q":"能源节约与生态环境保护管理工作应纳入哪个部门归口管理？","o":["安全环保部门","综合管理部门","工程技术部门","财务部门"],"a":0,"e":"手册规定：子企业本部、二级生产经营单位、项目公司、总承包项目部、施工项目部、装备制造企业、投资运营项目，应将能源节约与生态环境保护管理工作纳入安全环保部门归口管理；设计（工代）、监理项目部可纳入综合管理部门管理。","s":"第二部分 二、（一）2（1）（2）"},{"id":"D02-003","t":"single","c":"D02","q":"设计（工代）、监理项目部在人员配备上的要求是：","o":["配备一名专业管理人员","配备专职管理人员不少于2人","可不配备","由项目经理兼任"],"a":0,"e":"手册规定：子企业本部等配备能源节约与生态环境保护专职管理人员；设计（工代）、监理项目部配备一名专业管理人员。","s":"第二部分 二、（一）3"},{"id":"D02-004","t":"single","c":"D02","q":"设计（工代）、监理项目部的能源节约与生态环境保护工作第一责任人是：","o":["项目经理、总监理工程师","党政主要负责人","安全总监","专职管理人员"],"a":0,"e":"手册规定：子企业本部等明确党政主要负责人是第一责任人；设计（工代）、监理项目部明确项目经理、总监理工程师为第一责任人。","s":"第二部分 二、（一）4（1）（2）"},{"id":"D02-005","t":"judge","c":"D02","q":"各单位应建立健全岗位节能环保责任清单，完善一岗一清单，并以正式文件明确。","o":["正确","错误"],"a":0,"e":"手册规定：各单位建立健全岗位节能环保责任清单，完善一岗一清单，并以正式文件明确。","s":"第二部分 二、（一）4（3）"},{"id":"D03-001","t":"single","c":"D03","q":"能源节约与生态环境保护配套制度应由谁签发？","o":["第一责任人","分管领导","安全总监","主管部门负责人"],"a":0,"e":"手册规定：建立管理、统计监测、考核奖惩办法、事件管理与责任追究等配套制度，并由第一责任人签发。","s":"第二部分 三、管理制度（一）1"},{"id":"D03-002","t":"single","c":"D03","q":"下列哪类单位不需要制定统计监测制度？","o":["一般类企业、设计（工代）项目、监理项目","施工项目部","装备制造企业","投资运营项目"],"a":0,"e":"手册规定：一般类企业、设计（工代）项目、监理项目不需要制定统计监测制度。","s":"第二部分 三、管理制度（一）3（2）"},{"id":"D03-003","t":"judge","c":"D03","q":"检查考核制度的多少（数量）是衡量制度建设的考核标准。","o":["正确","错误"],"a":1,"e":"手册明确：不应以制度的数量作为检查考核标准，应以制度内容是否覆盖全业务领域所规定或要求开展相关工作的内容作为检查考核标准。","s":"第二部分 三、管理制度（三）2"},{"id":"D03-004","t":"single","c":"D03","q":"事件管理与责任追究制度应具备的内容是：","o":["事件分类、事件报告、事件调查、责任追究","事故等级划分、经济处罚标准","应急预案、演练计划","培训计划、考核标准"],"a":0,"e":"手册规定：事件管理与责任追究制度要具备完整性，包含事件分类、事件报告、事件调查、责任追究内容等。","s":"第二部分 三、管理制度（一）3（4）"},{"id":"D04-001","t":"single","c":"D04","q":"能源节约与生态环境保护年度工作计划应：","o":["由第一责任人签发，可与安全生产与职业健康工作计划同步制定，也可单独制定","由分管领导签发即可","由主管部门自行制定","无需签发"],"a":0,"e":"手册规定：制定能源节约与生态环境保护年度工作计划，并由第一责任人签发。可与安全生产与职业健康工作计划同步制定，也可单独制定。","s":"第二部分 四、工作计划（一）2"},{"id":"D04-002","t":"single","c":"D04","q":"能源节约与生态环境保护工作计划执行情况的抽检率应不低于：","o":["20%","10%","30%","50%"],"a":0,"e":"手册规定：工作计划执行情况的抽检率应不低于20%。","s":"第二部分 四、工作计划（三）3"},{"id":"D04-003","t":"judge","c":"D04","q":"本级单位的能源节约与生态环境保护年度工作目标可以低于上级单位的工作目标。","o":["正确","错误"],"a":1,"e":"手册规定：结合工作实际，本级单位的年度工作目标不得低于上级单位的工作目标，应对工作目标进行逐级分解、细化，逐级签订目标责任书。","s":"第二部分 四、工作计划（一）6"},{"id":"D04-004","t":"single","c":"D04","q":"施工项目部在工作计划中应体现：","o":["将各分包商纳入项目的绿色施工管理","仅体现本单位工作","仅体现上级要求","无需体现分包商管理"],"a":0,"e":"手册规定：项目公司、总承包项目部将承包单位纳入项目的绿色施工管理，施工项目部将各分包商纳入项目的绿色施工管理，并在工作计划中体现。","s":"第二部分 四、工作计划（一）5"},{"id":"D05-001","t":"single","c":"D05","q":"宣传工作应至少在每年开展的活动不包括：","o":["安全生产月","环境日","全国节能宣传周","低碳日"],"a":0,"e":"手册规定：至少在每年开展环境日、全国节能宣传周、低碳日等宣传活动，并利用网络信息平台进行宣传报道。","s":"第二部分 五、宣传培训（一）1（2）"},{"id":"D05-002","t":"single","c":"D05","q":"能源节约与生态环境保护培训分为三类，即：","o":["主要负责人培训、管理人员培训、作业人员培训","入场培训、岗前培训、转岗培训","公司级、项目级、班组级","理论培训、实操培训、应急培训"],"a":0,"e":"手册规定：培训工作分为主要负责人培训、管理人员培训、作业人员培训。","s":"第二部分 五、宣传培训（一）2（3）"},{"id":"D05-003","t":"single","c":"D05","q":"作业人员培训内容主要是：","o":["作业现场重要耗能设备设施及节能降耗管理要求，主要环境影响因素及污染治理、生态环境保护设施设备操作规程、绿色施工管理规程等","能源节约与生态环境保护工作形势、法律法规及职责要求","国家及地方有关法律法规、上级及本单位管理要求","企业发展战略与经营目标"],"a":0,"e":"手册规定：主要负责人培训内容主要有工作形势、法律法规及职责要求；管理人员培训内容主要是国家及地方法律法规、上级及本单位管理要求；作业人员培训内容主要是现场重要耗能设备设施及节能降耗要求、环境影响因素及污染治理、设施设备操作规程、绿色施工管理规程等。","s":"第二部分 五、宣传培训（一）2（3）"},{"id":"D05-004","t":"judge","c":"D05","q":"能源节约与生态环境保护培训计划应由第一责任人签发。","o":["正确","错误"],"a":0,"e":"手册专家检查考核要求：检查培训计划是否由第一责任人签发。","s":"第二部分 五、宣传培训（三）1"},{"id":"D06-001","t":"single","c":"D06","q":"年度能源节约与生态环境保护费用预算的构成是：","o":["管理投入和措施投入两部分","仅措施投入","仅管理投入","仅设备购置费用"],"a":0,"e":"手册规定：费用预算包含两部分：一是管理投入（培训、宣传、考核和表彰奖励及其他管理投入）；二是措施投入（技术创新科研投入、设备设施配置更新及改造维护投入、其他措施落实投入）。","s":"第二部分 六、费用投入及使用管理（一）1（2）"},{"id":"D06-002","t":"judge","c":"D06","q":"能源节约与生态环境保护费用与安全生产、科技、设备等专项费用预算有重合的，可以重复计列。","o":["正确","错误"],"a":1,"e":"手册规定：与安全生产、科技、设备等专项费用预算有重合的，则不能重复计列；资金使用与专项费用投入有重合的，不能重复统计。","s":"第二部分 六、费用投入及使用管理（一）1（4）、2（3）"},{"id":"D06-003","t":"single","c":"D06","q":"能源节约与生态环境保护资金应做到：","o":["专款专用，用于与能源节约与生态环境保护管理有关的事务","可用于其他管理费用","由项目部统筹使用","无需建立台账"],"a":0,"e":"手册规定：资金要用到与能源节约与生态环境保护管理有关的事务，做到专款专用，并建立资金使用台账（使用日期、内容、金额、使用人签名、审批人签名等）。","s":"第二部分 六、费用投入及使用管理（一）2"},{"id":"D06-004","t":"single","c":"D06","q":"年度能源节约与生态环境保护费用预算应由谁签发？","o":["第一责任人","分管领导","财务负责人","主管部门负责人"],"a":0,"e":"手册规定：编制年度能源节约与生态环境保护费用预算，由第一责任人签发，并严格执行。","s":"第二部分 六、费用投入及使用管理（一）1（1）"},{"id":"D07-001","t":"single","c":"D07","q":"重要耗能设备设施台账的内容包括：","o":["设备名称、型号、数量、功率、运行时间、责任单位/部门","仅设备名称和数量","仅设备型号和功率","仅责任部门"],"a":0,"e":"手册规定：重要耗能设备设施台账包括设备名称、型号、数量、功率、运行时间、责任单位/部门等内容。","s":"第二部分 七、耗能设备设施和生态环境污染源识别评价（一）3（2）"},{"id":"D07-002","t":"judge","c":"D07","q":"生态环境污染源清单应根据工作内容、作业工序、工作场所的变化及时更新。","o":["正确","错误"],"a":0,"e":"手册规定：开展全作业周期的生态环境污染源识别工作，并建立生态环境污染源清单，并根据工作内容、作业工序、工作场所的变化及时更新。","s":"第二部分 七、（一）5"},{"id":"D07-003","t":"single","c":"D07","q":"耗能设备设施的识别评价应重点考虑：","o":["《能源节约与生态环境保护统计监测报表》中的能耗指标，包括耗煤、耗油、耗电、耗气等设备设施","仅耗电设备","仅大型设备","仅运输车辆"],"a":0,"e":"手册规定：耗能设备设施的识别评价考虑《能源节约与生态环境保护统计监测报表》中的能耗指标，包括但不限于耗煤、耗油、耗电、耗气等设备设施。","s":"第二部分 七、（一）3（1）"},{"id":"D07-004","t":"single","c":"D07","q":"项目公司、总承包项目部在耗能设备设施管理上的工作是：","o":["识别评价项目全施工周期的重要耗能设备设施，列出设备类型、准入标准或准入原则","建立设备台账并每日记录","负责设备维修保养","负责设备采购"],"a":0,"e":"手册规定：项目公司、总承包项目部识别评价项目全施工周期的重要耗能设备设施，列出设备类型、准入标准或准入原则等。","s":"第二部分 七、（一）2"},{"id":"D08-001","t":"single","c":"D08","q":"项目公司、总承包项目部对承包单位的能源节约、生态环境保护及污染物治理专项措施方案应：","o":["进行备案管理","审批后实施","无需管理","由承包单位自行保存"],"a":0,"e":"手册规定：项目公司、总承包项目部对承包单位能源节约专项措施方案、生态环境保护及污染物治理专项措施方案进行备案管理。","s":"第二部分 八、专项措施（一）2"},{"id":"D08-002","t":"single","c":"D08","q":"节能降耗措施正式使用前，应对设施和设备进行：","o":["最优能耗调试，将运行参数编入措施方案，并做好日常操作运行记录","一般性试运行","负荷试验","安全检测"],"a":0,"e":"手册规定：鉴于主要耗能设施和设备在不同工况条件下的最优运行参数不同，正式使用之前，对设施和设备进行最优能耗调试，将运行参数编入措施方案，并做好日常操作运行记录。","s":"第二部分 八、（一）3（3）"},{"id":"D08-003","t":"single","c":"D08","q":"施工项目修建营地临建设施前，临建设施方案中应明确的内容是：","o":["化粪池、隔油池等环保设施的规格、型式、定期清理频次，以及节水冲洗、节能灯具等能源节约内容","仅房屋结构","仅消防间距","仅用电负荷"],"a":0,"e":"手册规定：施工项目修建营地临建设施前，应在临建设施方案中明确化粪池、隔油池等环保设施的规格、型式、定期清理频次等内容，应明确使用节水冲洗、节能灯具等能源节约内容，并按方案实施。","s":"第二部分 八、（一）8"},{"id":"D08-004","t":"judge","c":"D08","q":"施工项目部针对施工区域涉及人文景观、特殊地质、文物古树、相关管线分布等情况，应编制专项保护措施方案并落实。","o":["正确","错误"],"a":0,"e":"手册规定：施工项目部针对施工区域涉及人文景观、特殊地质、文物古树、相关管线分布等情况，编制专项的保护措施方案并落实。","s":"第二部分 八、（一）4（4）"},{"id":"D09-001","t":"single","c":"D09","q":"突发环境事件应急预案应具备的内容不包括：","o":["员工薪酬管理办法","工作依据、工作原则、事件分级","主要环境风险源分析、应急组织体系、工作职责","预防预警、处置、保障、宣传、培训、演练"],"a":0,"e":"手册规定：预案具备完整性，包含工作依据、工作原则、事件分级、主要环境风险源分析、应急组织体系、工作职责、预防预警、处置、保障、宣传、培训、演练等内容。","s":"第二部分 九、环境风险与应急管理（一）4（1）"},{"id":"D09-002","t":"single","c":"D09","q":"作业现场存在多个重大环境风险时，现场处置方案应：","o":["每个重大环境风险单独编制现场处置方案","合并编制一个综合方案","只编制一个总体预案即可","由上级单位统一编
